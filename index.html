  /* ---------------- Global key handling ---------------- */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const hadOverlay = document.getElementById('send-to-overlay') || document.getElementById('help-overlay') || document.getElementById('global-popover') || document.getElementById('tag-suggest-popover');
      closeTagSuggest();
      closePopover();
      closeMenu();
      closeSendToPalette();
      closeHelp();
      if (!hadOverlay && document.activeElement) document.activeElement.blur();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.code === 'KeyM') {
      e.preventDefault();
      openSendToPalette();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.code === 'KeyZ') {
      e.preventDefault();
      undo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && ((e.shiftKey && e.code === 'KeyZ') || e.code === 'KeyY')) {
      e.preventDefault();
      redo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.code === 'Slash') {
      e.preventDefault();
      openHelp();
    }
  });

  document.addEventListener('click', (e) => {
    const chip = e.target.closest('.link-chip');
    if (chip) {
      e.preventDefault();
      let href = unescapeHtml(chip.dataset.href || '');
      if (!/^https?:\/\//i.test(href)) href = 'https://' + href;
      window.open(href, '_blank', 'noopener');
    }
  });

  document.addEventListener('click', (e) => {
    const pop = document.getElementById('global-popover');
    if (pop && !pop.contains(e.target) && !e.target.closest('.date-badge') && !e.target.closest('.row-move-btn')) {
      closePopover();
    }
  });

  function setActive(id) {
    if (activeId && activeId !== id) {
      const prevNote = document.querySelector('.note-field[data-id="' + activeId + '"]');
      if (prevNote && !prevNote.textContent.trim()) prevNote.style.display = 'none';
    }
    activeId = id;
  }

  /* ---------------- Caret helpers ---------------- */
  function getCaretOffset(el) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return 0;
    const range = sel.getRangeAt(0);
    if (!el.contains(range.startContainer)) return 0;
    const pre = range.cloneRange();
    pre.selectNodeContents(el);
    pre.setEnd(range.startContainer, range.startOffset);
    return pre.toString().length;
  }

  function setCaretByOffset(el, offset) {
    const sel = window.getSelection();
    const range = document.createRange();
    let remaining = offset, targetNode = el, targetOffset = 0;
    function walk(n) {
      if (n.nodeType === Node.TEXT_NODE) {
        const len = n.textContent.length;
        if (remaining <= len) { targetNode = n; targetOffset = remaining; return true; }
        remaining -= len;
      } else {
        for (const child of n.childNodes) { if (walk(child)) return true; }
      }
      return false;
    }
    walk(el);
    try {
      range.setStart(targetNode, targetOffset); range.collapse(true);
      sel.removeAllRanges(); sel.addRange(range);
    } catch (err) { /* node vanished mid-render */ }
  }

  /* ---------------- #hashtag / @name suggestions ---------------- */
  let tagSuggest = null; // { el, node, isNote, trigger, start, items, index }

  function collectAllTags() {
    const hash = new Map(), at = new Map();
    function scan(text) {
      if (!text) return;
      (text.match(/(^|\s)(#[\w-]+)/g) || []).forEach(m => {
        const tag = m.trim(), key = tag.toLowerCase();
        if (!hash.has(key)) hash.set(key, { display: tag, count: 0 });
        hash.get(key).count++;
      });
      (text.match(/(^|\s)(@[\w-]+)/g) || []).forEach(m => {
        const tag = m.trim(), key = tag.toLowerCase();
        if (!at.has(key)) at.set(key, { display: tag, count: 0 });
        at.get(key).count++;
      });
    }
    (function walk(n) { scan(n.text); scan(n.note); n.children.forEach(walk); })(tree);
    return { hash, at };
  }

  // Finds an in-progress #tag or @name ending exactly at the caret: walks
  // back from the caret over an unbroken run of non-whitespace and checks
  // whether it started with # or @. The marker must also start a word, so
  // that "C#" or "a@b" don't pop the suggester (they don't render as tags
  // either — this keeps detection and rendering in sync).
  function detectTagTrigger(text, caretOffset) {
    let i = caretOffset - 1;
    while (i >= 0 && text[i] !== '#' && text[i] !== '@' && !/\s/.test(text[i])) i--;
    if (i < 0 || (text[i] !== '#' && text[i] !== '@')) return null;
    if (i > 0 && !/\s/.test(text[i - 1])) return null;
    return { trigger: text[i], start: i, partial: text.slice(i + 1, caretOffset) };
  }

  function getCaretClientRect(el) {
    const sel = window.getSelection();
    if (sel.rangeCount) {
      const range = sel.getRangeAt(0).cloneRange();
      range.collapse(true);
      const rects = range.getClientRects();
      if (rects.length) return rects[0];
    }
    return el.getBoundingClientRect();
  }

  function closeTagSuggest() {
    const pop = document.getElementById('tag-suggest-popover');
    if (pop) pop.remove();
    tagSuggest = null;
  }

  function updateTagSuggest(el, node, isNote) {
    const text = el.textContent;
    const trig = detectTagTrigger(text, getCaretOffset(el));
    if (!trig) { closeTagSuggest(); return; }

    const all = collectAllTags();
    const pool = trig.trigger === '#' ? all.hash : all.at;
    const q = (trig.trigger + trig.partial).toLowerCase();
    const items = Array.from(pool.values())
      .filter(t => t.display.toLowerCase().startsWith(q) && t.display.toLowerCase() !== q)
      .sort((a, b) => b.count - a.count || a.display.localeCompare(b.display))
      .slice(0, 8);

    if (items.length === 0) { closeTagSuggest(); return; }
    tagSuggest = { el, node, isNote, trigger: trig.trigger, start: trig.start, items, index: 0 };
    renderTagSuggestPopover();
  }

  function renderTagSuggestPopover() {
    let pop = document.getElementById('tag-suggest-popover');
    if (!pop) { pop = document.createElement('div'); pop.id = 'tag-suggest-popover'; document.body.appendChild(pop); }
    pop.innerHTML = '';
    tagSuggest.items.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'tag-suggest-item' + (i === tagSuggest.index ? ' active' : '');
      const chipClass = tagSuggest.trigger === '#' ? 'tag-hash' : 'tag-at';
      row.innerHTML = '<span class="' + chipClass + '">' + escapeHtml(item.display) + '</span>' +
        (item.count > 1 ? '<span class="tag-suggest-count">' + item.count + '\u00D7</span>' : '');
      row.onmousedown = (e) => { e.preventDefault(); applyTagSuggest(i); }; // mousedown so the field never blurs
      pop.appendChild(row);
    });
    const rect = getCaretClientRect(tagSuggest.el);
    pop.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 250)) + 'px';
    let top = rect.bottom + 4;
    if (top + 220 > window.innerHeight) top = Math.max(8, rect.top - 220 - 4);
    pop.style.top = top + 'px';
  }

  function applyTagSuggest(i) {
    if (!tagSuggest) return;
    const { el, node, isNote, start, items } = tagSuggest;
    const item = items[i];
    const text = el.textContent;
    const caretOffset = getCaretOffset(el);
    const newText = text.slice(0, start) + item.display + ' ' + text.slice(caretOffset);
    const newCaret = start + item.display.length + 1;
    if (isNote) node.note = newText; else node.text = newText;
    el.innerHTML = renderInlineContent(newText);
    closeTagSuggest();
    el.focus();
    setCaretByOffset(el, newCaret);
    scheduleSave();
  }

  // Returns true if it handled the key (caller should stop here).
  function handleTagSuggestKeydown(e, el) {
    if (!tagSuggest || tagSuggest.el !== el) return false;
    if (e.key === 'ArrowDown') { e.preventDefault(); tagSuggest.index = (tagSuggest.index + 1) % tagSuggest.items.length; renderTagSuggestPopover(); return true; }
    if (e.key === 'ArrowUp') { e.preventDefault(); tagSuggest.index = (tagSuggest.index - 1 + tagSuggest.items.length) % tagSuggest.items.length; renderTagSuggestPopover(); return true; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); applyTagSuggest(tagSuggest.index); return true; }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeTagSuggest(); return true; }
    return false;
  }

  /* ---------------- Node rendering ---------------- */
  function isEffectivelyCollapsed(node) {
    if (!node.collapsed) return false;
    const { forceOpenSet } = filterState();
    return !(forceOpenSet && forceOpenSet.has(node.id));
  }

  function toggleCollapse(id) {
    const node = findNode(tree, id);
    if (!node) return;
    // Toggle against what's actually on screen, not the stored flag: while a
    // search forces a branch open the flag is still `true`, so a plain
    // !collapsed flip did nothing visible on the first click.
    const effective = isEffectivelyCollapsed(node);
    if (!effective && node.collapsed && isFilterActive()) {
      filterCollapseOverride.add(id); // was only open because of the filter
    } else {
      filterCollapseOverride.delete(id);
      node.collapsed = !effective;
    }
    render();
    scheduleSave();
  }

  // Paste is intercepted so contenteditable can't inject markup or <div>
  // line breaks that would desync from the plain-text model. Multi-line
  // paste into a title becomes one item per line, which is what you want
  // when pasting a list in from somewhere else.
  function handlePaste(e, el, node, isNote) {
    e.preventDefault();
    const raw = ((e.clipboardData || window.clipboardData).getData('text/plain') || '').replace(/\r\n?/g, '\n');
    const offset = getCaretOffset(el);
    const cur = el.textContent;
    const before = cur.slice(0, offset), after = cur.slice(offset);
    pushUndo();

    if (isNote) {
      const next = before + raw + after;
      node.note = next;
      el.innerHTML = renderInlineContent(next);
      setCaretByOffset(el, offset + raw.length);
      scheduleSave();
      return;
    }

    // Single line: straight insertion, no interpretation.
    if (!raw.includes('\n')) {
      const next = before + raw + after;
      node.text = next;
      el.innerHTML = renderInlineContent(next);
      setCaretByOffset(el, offset + raw.length);
      scheduleSave();
      return;
    }

    // Multi-line: run it through the same Markdown reader as Import, so
    // indentation, bullets and checkboxes come across as real structure
    // instead of collapsing into one line.
    const parsed = parseMarkdown(raw);
    if (parsed.length === 0) return;

    const first = parsed[0];
    node.text = before + first.text;
    if (first.note) node.note = [node.note, first.note].filter(s => s && s.trim()).join('\n');
    node.children = first.children.concat(node.children);

    const sib = siblingsAndIndex(node.id);
    let insertAt = sib.idx;
    for (let i = 1; i < parsed.length; i++) sib.parent.children.splice(++insertAt, 0, parsed[i]);

    const tailNode = parsed.length > 1 ? parsed[parsed.length - 1] : node;
    const caretAt = tailNode.text.length;
    tailNode.text = tailNode.text + after;
    render();
    scheduleSave();
    focusNodeAtOffset(tailNode.id, caretAt);
  }

  function buildNodeEl(node, depth, visibleSet, forceOpenSet) {
    const hiddenByCompleted = hideCompleted && node.completed;
    const hiddenByFilter = !!visibleSet && !visibleSet.has(node.id);

    const wrapper = document.createElement('div');
    wrapper.className = 'node-wrapper' + (node.completed ? ' completed' : '') + ((hiddenByCompleted || hiddenByFilter) ? ' is-hidden' : '');
    wrapper.dataset.id = node.id;

    const hasChildren = node.children && node.children.length > 0;
    const forcedOpen = !!forceOpenSet && forceOpenSet.has(node.id);
    const effectiveCollapsed = node.collapsed && !forcedOpen;

    // Indent is a CSS token, so the row, the note and the hit targets can't
    // drift out of alignment when the sizing changes (e.g. on touch).
    wrapper.style.setProperty('--depth', String(depth));

    const row = document.createElement('div');
    row.className = 'row' + (hasChildren ? ' has-children' : '');

    const isLeaf = !hasChildren;

    // Drag handle: the only thing in the row that shows a grab cursor.
    const handle = document.createElement('div');
    handle.className = 'drag-handle';
    handle.title = 'Drag to move';
    handle.setAttribute('aria-hidden', 'true');
    handle.draggable = true;
    handle.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
    handle.addEventListener('dragstart', (e) => {
      dragNodeId = node.id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', node.id);
      wrapper.classList.add('dragging');
    });
    handle.addEventListener('dragend', () => {
      dragNodeId = null;
      wrapper.classList.remove('dragging');
      clearDragIndicators();
    });
    row.appendChild(handle);

    const caret = document.createElement('div');
    caret.className = 'caret' + (isLeaf ? ' leaf' : '') + (effectiveCollapsed ? ' collapsed' : '');
    caret.innerHTML = '<span class="caret-glyph">\u25BE</span>';
    if (!isLeaf) {
      caret.title = effectiveCollapsed ? 'Expand' : 'Collapse';
      caret.onclick = () => toggleCollapse(node.id);
      makeKeyboardActivatable(caret, () => toggleCollapse(node.id));
    }
    row.appendChild(caret);

    /* Bullet: click (or Enter/Space when focused) to zoom in, drag to move */
    const bullet = document.createElement('div');
    bullet.className = 'bullet-dot';
    bullet.title = hasChildren && effectiveCollapsed
      ? node.children.length + ' hidden \u00B7 zoom in'
      : 'Zoom in';
    const zoomIn = () => { zoomStack.push(node.id); render(); };
    makeKeyboardActivatable(bullet, zoomIn);

    // Touch has no drag handle (HTML5 drag doesn't fire there), so a long
    // press on the bullet opens "Move to…" instead.
    let pressTimer = null, pressFired = false;
    const cancelPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
    bullet.addEventListener('touchstart', () => {
      pressFired = false;
      pressTimer = setTimeout(() => { pressTimer = null; pressFired = true; openMovePopover(node, bullet); }, 450);
    }, { passive: true });
    ['touchmove', 'touchend', 'touchcancel'].forEach(ev => bullet.addEventListener(ev, cancelPress, { passive: true }));
    bullet.onclick = (e) => {
      if (pressFired) { pressFired = false; e.stopPropagation(); return; } // long press already acted
      zoomIn();
    };
    row.appendChild(bullet);

    row.addEventListener('dragover', (e) => {
      if (!dragNodeId || dragNodeId === node.id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = row.getBoundingClientRect();
      const ratio = (e.clientY - rect.top) / rect.height;
      const zone = ratio < 0.25 ? 'before' : ratio > 0.75 ? 'after' : 'child';
      clearDragIndicators();
      row.classList.add('drag-over-' + zone);
      dragOverZone = zone;
    });
    // Without this the drop marker stayed painted on the last row the
    // pointer crossed, so two rows could look like the drop target.
    row.addEventListener('dragleave', (e) => {
      if (!row.contains(e.relatedTarget)) row.classList.remove('drag-over-before', 'drag-over-after', 'drag-over-child');
    });
    row.addEventListener('drop', (e) => {
      if (!dragNodeId || dragNodeId === node.id) return;
      e.preventDefault();
      performDrop(dragNodeId, node.id, dragOverZone);
      clearDragIndicators();
      dragNodeId = null;
    });

    // No dead zones: clicking the blank part of the line puts the caret in
    // the text rather than doing nothing. mousedown (not click) so the
    // browser never starts a selection drag in the gap first.
    row.addEventListener('mousedown', (e) => {
      if (e.target !== row) return; // a real control was clicked
      e.preventDefault();
      const rect = content.getBoundingClientRect();
      focusNode(node.id, e.clientX < rect.left);
    });

    const content = document.createElement('div');
    content.className = 'content';
    content.contentEditable = 'true';
    content.dataset.id = node.id;
    content.innerHTML = renderInlineContent(node.text);

    content.addEventListener('focus', () => setActive(node.id));
    content.addEventListener('input', () => onContentInput(content, node, row));
    content.addEventListener('keydown', (e) => onKeyDown(e, node.id));
    content.addEventListener('paste', (e) => handlePaste(e, content, node, false));
    content.addEventListener('blur', () => { if (tagSuggest && tagSuggest.el === content) closeTagSuggest(); });
    row.appendChild(content);

    /* Date badge & recurring tag */
    if (node.date || node.recurring) {
      const badge = document.createElement('div');
      badge.className = 'date-badge ' + (node.date ? dateClass(node.date) : 'd-future');
      const dateLabel = node.date ? formatDate(node.date) : 'No date';
      const recurDisplay = { daily: 'daily', weekly: 'weekly', monthly: 'monthly', quarterly: 'quarterly', yearly: 'annually' };
      const recurLabel = node.recurring === 'custom'
        ? 'every ' + (node.recurInterval || 1) + ' ' + (node.recurUnit || 'weeks')
        : (recurDisplay[node.recurring] || node.recurring);
      badge.innerHTML = escapeHtml(dateLabel) + (node.recurring ? ' <span class="tag-repeat">\u21BB ' + escapeHtml(recurLabel) + '</span>' : '');
      badge.title = node.date ? node.date : 'Repeats, no date set';
      const openDp = () => openDatePopover(node, badge, node.id);
      badge.onclick = (e) => { e.stopPropagation(); openDp(); };
      makeKeyboardActivatable(badge, openDp);
      row.appendChild(badge);
    }

    /* Move to a different parent */
    const moveBtn = document.createElement('div');
    moveBtn.className = 'row-move-btn';
    moveBtn.title = 'Move to\u2026';
    moveBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="21" y1="3" x2="9" y2="15"/><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>';
    const openMp = () => openMovePopover(node, moveBtn);
    moveBtn.onclick = (e) => { e.stopPropagation(); openMp(); };
    makeKeyboardActivatable(moveBtn, openMp);
    row.appendChild(moveBtn);

    wrapper.appendChild(row);

    /* Note field: rendered only when present or triggered with Shift+Enter.
       Indent and width come from the shared row tokens. Contenteditable
       (not a textarea) so #tags/@mentions/links highlight inside notes too. */
    const note = document.createElement('div');
    note.className = 'note-field';
    note.contentEditable = 'true';
    note.dataset.id = node.id;
    note.dataset.placeholder = 'Add note\u2026';
    note.innerHTML = renderInlineContent(node.note || '');
    const showNote = !!(node.note && node.note.trim()) || (node.id === activeId && node.showNote);
    note.style.display = showNote ? 'block' : 'none';
    note.addEventListener('focus', () => setActive(node.id));
    note.addEventListener('input', () => onNoteInput(note, node));
    note.addEventListener('keydown', (e) => onNoteKeyDown(e, node.id, note));
    note.addEventListener('paste', (e) => handlePaste(e, note, node, true));
    note.addEventListener('blur', () => {
      if (tagSuggest && tagSuggest.el === note) closeTagSuggest();
      if (!note.textContent.trim()) { node.note = ''; node.showNote = false; note.style.display = 'none'; }
    });
    wrapper.appendChild(note);

    if (hasChildren) {
      const childrenWrap = document.createElement('div');
      childrenWrap.className = 'children-wrap' + (effectiveCollapsed ? ' collapsed' : '');
      const inner = document.createElement('div');
      inner.className = 'children-inner';
      node.children.forEach(c => inner.appendChild(buildNodeEl(c, depth + 1, visibleSet, forceOpenSet)));
      childrenWrap.appendChild(inner);
      wrapper.appendChild(childrenWrap);
    }
    return wrapper;
  }

  /* ---------------- Editing ---------------- */
  // "!" opens the date picker, but only when it starts a word — otherwise
  // typing "Ship it!" swallowed the exclamation mark and popped a calendar.
  function isDateTrigger(text, caretOffset) {
    if (caretOffset <= 0 || text[caretOffset - 1] !== '!') return false;
    return caretOffset === 1 || /\s/.test(text[caretOffset - 2]);
  }

  function onContentInput(el, node, row) {
    pushUndo(700);
    let caretOffset = getCaretOffset(el);
    let text = el.textContent;

    if (isDateTrigger(text, caretOffset)) {
      text = text.slice(0, caretOffset - 1) + text.slice(caretOffset);
      caretOffset -= 1;
      node.text = text;
      el.innerHTML = renderInlineContent(text);
      setCaretByOffset(el, caretOffset);
      closeTagSuggest();
      openDatePopover(node, row, node.id);
      scheduleSave();
      return;
    }

    node.text = text;
    el.innerHTML = renderInlineContent(text);
    setCaretByOffset(el, caretOffset);
    scheduleSave();
    updateTagSuggest(el, node, false);
  }

  function onNoteInput(el, node) {
    pushUndo(700);
    let caretOffset = getCaretOffset(el);
    let text = el.textContent;

    if (isDateTrigger(text, caretOffset)) {
      text = text.slice(0, caretOffset - 1) + text.slice(caretOffset);
      caretOffset -= 1;
      node.note = text;
      el.innerHTML = renderInlineContent(text);
      setCaretByOffset(el, caretOffset);
      closeTagSuggest();
      openDatePopover(node, el, node.id);
      scheduleSave();
      return;
    }

    node.note = text;
    el.innerHTML = renderInlineContent(text);
    setCaretByOffset(el, caretOffset);
    scheduleSave();
    updateTagSuggest(el, node, true);
  }

  function onNoteKeyDown(e, id, el) {
    if (handleTagSuggestKeydown(e, el)) return;
    const node = findNode(tree, id);
    if (!node) return;

    if (e.key === 'Escape' || (e.key === 'Enter' && !e.shiftKey)) {
      e.preventDefault();
      e.stopPropagation();
      if (!el.textContent.trim()) { node.note = ''; node.showNote = false; el.style.display = 'none'; }
      focusNode(id, false);
      return;
    }
    if (e.key === 'Enter' && e.shiftKey) {
      // Manually insert a newline character (contenteditable's default
      // Enter behavior inserts <div>/<br> elements, which would desync
      // the caret math against the plain-text node.note model).
      e.preventDefault();
      pushUndo();
      const offset = getCaretOffset(el);
      const text = el.textContent;
      const newText = text.slice(0, offset) + '\n' + text.slice(offset);
      node.note = newText;
      el.innerHTML = renderInlineContent(newText);
      setCaretByOffset(el, offset + 1);
      scheduleSave();
      return;
    }
    // Up jumps to this item's own title; Down jumps to the next visible item.
    if (e.key === 'ArrowUp') { e.preventDefault(); focusNode(id, false); return; }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const flat = buildFlatVisibleIds();
      const i = flat.indexOf(id);
      if (i !== -1 && i < flat.length - 1) focusNode(flat[i + 1], true);
      return;
    }
  }

  // Order of currently visible node ids, top to bottom, matching what
  // render() draws (respects collapsed branches, hideCompleted, and any
  // active search/filter). Backs keyboard nav and its offset math.
  function buildFlatVisibleIds() {
    const { visibleSet, forceOpenSet } = filterState();
    const ids = [];
    (function walk(n) {
      n.children.forEach(c => {
        const hiddenByCompleted = hideCompleted && c.completed;
        const hiddenByFilter = !!visibleSet && !visibleSet.has(c.id);
        if (hiddenByCompleted || hiddenByFilter) return;
        ids.push(c.id);
        const forcedOpen = !!forceOpenSet && forceOpenSet.has(c.id);
        if (!(c.collapsed && !forcedOpen)) walk(c);
      });
    })(currentViewRoot());
    return ids;
  }

  function focusNodeAtOffset(id, offset) {
    requestAnimationFrame(() => {
      const el = document.querySelector('.content[data-id="' + id + '"]');
      if (!el) return;
      el.focus();
      setCaretByOffset(el, Math.min(offset, el.textContent.length));
    });
  }

  function focusNode(id, atStart) {
    requestAnimationFrame(() => {
      const el = document.querySelector('.content[data-id="' + id + '"]');
      if (!el) return;
      el.focus();
      const range = document.createRange(); const sel = window.getSelection();
      range.selectNodeContents(el); range.collapse(!!atStart);
      sel.removeAllRanges(); sel.addRange(range);
    });
  }

  function onKeyDown(e, id) {
    const node = findNode(tree, id);
    if (!node) return;
    const el = e.target;
    if (handleTagSuggestKeydown(e, el)) return;

    // Alt+Right: zoom into this item (same as clicking its bullet).
    // Alt+Left: zoom out one level (same as clicking the parent breadcrumb).
    if (e.key === 'ArrowRight' && e.altKey) {
      e.preventDefault();
      zoomStack.push(id);
      render();
      requestAnimationFrame(() => { const zi = document.getElementById('zoom-title-input'); if (zi) zi.focus(); });
      return;
    }
    if (e.key === 'ArrowLeft' && e.altKey) {
      e.preventDefault();
      if (zoomStack.length > 1) {
        const poppedId = zoomStack.pop();
        render();
        focusNode(poppedId, false);
      }
      return;
    }

    // Ctrl+.: toggle collapse/expand of this item's children (same as the caret).
    if (e.key === '.' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (node.children.length > 0) { toggleCollapse(id); focusNode(id, false); }
      return;
    }

    // Ctrl+Shift+Backspace: delete this item and everything under it.
    if (e.key === 'Backspace' && (e.ctrlKey || e.metaKey) && e.shiftKey) {
      e.preventDefault();
      const flat = buildFlatVisibleIds();
      const i = flat.indexOf(id);
      const sib = siblingsAndIndex(id);
      if (!sib) return;
      pushUndo();
      sib.parent.children.splice(sib.idx, 1);
      render();
      scheduleSave();
      if (i > 0) focusNode(flat[i - 1], false);
      flashStatus('deleted \u00B7 Ctrl+Z to undo');
      return;
    }

    // Ctrl+Shift+Arrow: reorder this item among its siblings.
    if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && (e.ctrlKey || e.metaKey) && e.shiftKey) {
      e.preventDefault();
      moveSibling(id, e.key === 'ArrowUp' ? -1 : 1);
      return;
    }

    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      const offset = getCaretOffset(el);
      const flat = buildFlatVisibleIds();
      const i = flat.indexOf(id);
      const targetIdx = i + (e.key === 'ArrowUp' ? -1 : 1);
      if (i !== -1 && targetIdx >= 0 && targetIdx < flat.length) focusNodeAtOffset(flat[targetIdx], offset);
      return;
    }

    /* Shift+Enter: show/add the note under this item */
    if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      node.showNote = true;
      setActive(id);
      const note = document.querySelector('.note-field[data-id="' + id + '"]');
      if (note) {
        note.style.display = 'block';
        note.focus();
        setCaretByOffset(note, note.textContent.length);
      }
      return;
    }

    /* Ctrl+Enter: complete / uncomplete, and roll a recurring task forward.
       render() rebuilds the whole list, which used to drop focus every
       time — so focus is restored to the new instance, else the next item. */
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      const flatBefore = buildFlatVisibleIds();
      const posBefore = flatBefore.indexOf(id);
      pushUndo();

      node.completed = !node.completed;

      let newInstanceId = null;
      if (node.completed) {
        // spawnedId remembers the instance this check-off produced, so the
        // same task can't stack up duplicate future copies when it's toggled.
        if (node.recurring && !node.spawnedId) {
          const sib = siblingsAndIndex(id);
          // Fresh ids for the whole subtree — the old JSON deep-copy cloned
          // child ids verbatim, so the copy and the original were the "same"
          // node as far as lookups were concerned.
          const nextNode = cloneSubtree(node, { clearCompleted: true });
          const nextDate = calcNextDate(node);
          // Every child comes back unticked (cloneSubtree clears completion)
          // and any dates they carry move by the same number of days.
          shiftSubtreeDates(nextNode, daysBetween(node.date || todayStr(), nextDate));
          nextNode.date = nextDate;
          nextNode.completed = false;
          nextNode.spawnedId = null;
          sib.parent.children.splice(sib.idx + 1, 0, nextNode);
          node.spawnedId = nextNode.id;
          newInstanceId = nextNode.id;
        }
      } else if (node.spawnedId) {
        // Unchecking takes back the instance the check-off created — but only
        // while it's still untouched. Once anything in it has been ticked off,
        // that's real work and it stays.
        const spawned = findNode(tree, node.spawnedId);
        const spawnedSib = spawned ? siblingsAndIndex(spawned.id) : null;
        const untouched = spawned && !spawned.completed && !subtreeHasCompleted(spawned);
        if (spawnedSib && untouched) spawnedSib.parent.children.splice(spawnedSib.idx, 1);
        else if (spawned) flashStatus('next one kept \u00b7 it has progress');
        node.spawnedId = null;
      }

      render();
      scheduleSave();

      // Focus stays on the item you just toggled, so pressing the shortcut
      // again undoes it. It only moves when the item has left the view --
      // e.g. Hide completed just swallowed it -- in which case prefer the
      // freshly spawned recurring instance, then the nearest surviving row.
      const flatAfter = buildFlatVisibleIds();
      let nextFocusId = null;
      if (flatAfter.includes(id)) nextFocusId = id;
      else if (newInstanceId && flatAfter.includes(newInstanceId)) nextFocusId = newInstanceId;
      else if (posBefore !== -1) {
        for (let i = posBefore + 1; i < flatBefore.length && !nextFocusId; i++) {
          if (flatAfter.includes(flatBefore[i])) nextFocusId = flatBefore[i];
        }
        for (let i = posBefore - 1; i >= 0 && !nextFocusId; i--) {
          if (flatAfter.includes(flatBefore[i])) nextFocusId = flatBefore[i];
        }
      }
      if (nextFocusId) focusNode(nextFocusId, false);
      return;
    }

    /* Enter: new sibling, splitting at the cursor */
    if (e.key === 'Enter') {
      e.preventDefault();
      pushUndo();
      const offset = getCaretOffset(el);
      const before = node.text.slice(0, offset);
      const after = node.text.slice(offset);
      const sib = siblingsAndIndex(id);
      const newNode = { id: newId(), text: after, note: '', date: null, recurring: null, completed: false, children: [] };
      // Pressing Enter at the end of an expanded parent adds the new item as
      // its first child, rather than a sibling stranded below the subtree.
      const splitsIntoChild = node.children.length > 0 && after === '' && !isEffectivelyCollapsed(node);
      if (splitsIntoChild) {
        node.collapsed = false;
        node.children.unshift(newNode);
      } else {
        node.text = before;
        sib.parent.children.splice(sib.idx + 1, 0, newNode);
      }
      pendingFocus = { id: newNode.id, atStart: true };
      render();
      scheduleSave();
      return;
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      const sib = siblingsAndIndex(id);
      if (!sib) return;
      if (e.shiftKey) {
        const gpInfo = siblingsAndIndex(sib.parent.id);
        if (!gpInfo) return; // already at the top level
        pushUndo();
        sib.parent.children.splice(sib.idx, 1);
        gpInfo.parent.children.splice(gpInfo.idx + 1, 0, node);
      } else {
        if (sib.idx === 0) return; // nothing to nest under
        pushUndo();
        const prevSibling = sib.parent.children[sib.idx - 1];
        sib.parent.children.splice(sib.idx, 1);
        prevSibling.children.push(node);
        prevSibling.collapsed = false;
      }
      pendingFocus = { id, atStart: false };
      render();
      scheduleSave();
      return;
    }

    if (e.key === 'Backspace') {
      const offset = getCaretOffset(el);
      const sel = window.getSelection();
      if (offset === 0 && sel.isCollapsed) {
        const flat = buildFlatVisibleIds();
        const i = flat.indexOf(id);
        if (i > 0) {
          e.preventDefault();
          const prev = findNode(tree, flat[i - 1]);
          const sib = siblingsAndIndex(id);
          if (!prev || !sib) return;
          pushUndo();
          const caretAt = prev.text.length;
          prev.text = prev.text + node.text;
          // Keep both notes instead of silently dropping the merged one.
          prev.note = [prev.note, node.note].filter(s => s && s.trim()).join('\n');
          prev.children = prev.children.concat(node.children);
          const sib2 = siblingsAndIndex(id);
          sib2.parent.children.splice(sib2.idx, 1);
          render();
          scheduleSave();
          focusNodeAtOffset(prev.id, caretAt);
        }
      }
      return;
    }
  }

  /* ---------------- Render ---------------- */
  function render() {
    renderBreadcrumbAndHeader();

    const filterActive = isFilterActive();
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === filterMode);
    });
    const optionsEl = document.getElementById('filter-options');
    const clearBtn = document.getElementById('btn-filter-clear');
    const activeBtn = optionsEl.querySelector('.filter-btn.active');
    optionsEl.classList.toggle('has-active', filterMode !== 'all');
    // Park the × directly after whichever chip is on, so it always has a
    // subject. With nothing active it goes back to the end (and hides).
    if (activeBtn) {
      if (clearBtn.previousElementSibling !== activeBtn) activeBtn.after(clearBtn);
      clearBtn.title = 'Clear ' + activeBtn.textContent + ' filter';
      clearBtn.setAttribute('aria-label', clearBtn.title);
    } else if (optionsEl.lastElementChild !== clearBtn) {
      optionsEl.appendChild(clearBtn);
    }
    document.getElementById('btn-search-toggle').classList.toggle('has-active', !!searchQuery.trim());

    const { visibleSet, forceOpenSet } = filterState();

    const listEl = document.getElementById('outline-list');
    listEl.innerHTML = '';

    const viewRoot = currentViewRoot();
    // Only the children matter here: the view root itself matching (e.g. the
    // search hit is the zoomed-in item's own title) used to render an empty
    // list with no explanation.
    const anyChildVisible = !filterActive || viewRoot.children.some(c => visibleSet.has(c.id));

    if (viewRoot.children.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state click-add';
      empty.textContent = 'Click to add an item\u2026';
      empty.onclick = addBullet;
      listEl.appendChild(empty);
    } else if (filterActive && !anyChildVisible) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Nothing matches here. Clear the search or filter to see everything.';
      listEl.appendChild(empty);
    } else {
      viewRoot.children.forEach((c) => listEl.appendChild(buildNodeEl(c, 0, visibleSet, forceOpenSet)));
      if (!filterActive) {
        const spacer = document.createElement('div');
        spacer.className = 'click-add';
        spacer.style.height = '150px';
        spacer.onclick = addBullet;
        listEl.appendChild(spacer);
      }
    }
    if (pendingFocus) { const { id, atStart } = pendingFocus; pendingFocus = null; focusNode(id, atStart); }
  }

  function addBullet() {
    filterMode = 'all';
    searchQuery = '';
    resetFilterOverrides();
    document.getElementById('search-input').value = '';
    document.getElementById('search-box').classList.remove('expanded');
    pushUndo();
    const viewRoot = currentViewRoot();
    const n = { id: newId(), text: '', note: '', date: null, recurring: null, completed: false, children: [] };
    viewRoot.children.push(n);
    pendingFocus = { id: n.id, atStart: true };
    render();
    scheduleSave();
  }

  /* ---------------- Filter & search controls ---------------- */
  const searchBoxEl = document.getElementById('search-box');
  const searchInputEl = document.getElementById('search-input');

  document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
    btn.onclick = () => {
      filterMode = (filterMode === btn.dataset.filter) ? 'all' : btn.dataset.filter;
      resetFilterOverrides();
      render();
    };
  });

  document.getElementById('btn-filter-clear').onclick = () => {
    filterMode = 'all';
    resetFilterOverrides();
    render();
  };

  document.getElementById('btn-search-toggle').onclick = (e) => {
    e.stopPropagation();
    const willExpand = !searchBoxEl.classList.contains('expanded');
    searchBoxEl.classList.toggle('expanded', willExpand);
    if (willExpand) searchInputEl.focus();
  };

  searchInputEl.oninput = (e) => {
    searchQuery = e.target.value;
    resetFilterOverrides();
    render();
  };

  searchInputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      searchInputEl.value = '';
      searchQuery = '';
      resetFilterOverrides();
      searchBoxEl.classList.remove('expanded');
      searchInputEl.blur();
      render();
    }
  });

  searchInputEl.addEventListener('blur', () => {
    if (!searchInputEl.value.trim()) searchBoxEl.classList.remove('expanded');
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#search-box') && !searchInputEl.value.trim()) searchBoxEl.classList.remove('expanded');
  });

  /* ---------------- Menu ---------------- */
  const btnMenu = document.getElementById('btn-menu');
  const dropdownMenu = document.getElementById('dropdown-menu');

  function closeMenu() { dropdownMenu.classList.remove('show'); }
  btnMenu.onclick = (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('show'); };
  document.addEventListener('click', (e) => { if (!e.target.closest('.menu-container')) closeMenu(); });

  const toggleHideCompleted = document.getElementById('toggle-hide-completed');
  toggleHideCompleted.onchange = (e) => {
    hideCompleted = e.target.checked;
    render();
    scheduleSave();
  };

  // The whole menu row is a target, not just the 32px switch.
  function wireSwitchRow(rowId, input) {
    document.getElementById(rowId).addEventListener('click', (e) => {
      if (e.target.closest('.switch')) return; // the label handles its own clicks
      input.checked = !input.checked;
      input.dispatchEvent(new Event('change'));
    });
  }

  document.getElementById('menu-clear-completed').onclick = () => {
    closeMenu();
    let count = 0;
    (function count_(node) { node.children.forEach(c => { if (c.completed) count++; count_(c); }); })(tree);
    if (count === 0) { flashStatus('nothing completed yet'); return; }
    pushUndo();
    (function purge(node) {
      node.children = node.children.filter(c => !c.completed);
      node.children.forEach(purge);
    })(tree);
    render();
    scheduleSave();
    flashStatus('deleted ' + count + ' \u00B7 Ctrl+Z to undo');
  };

  document.getElementById('menu-shortcuts').onclick = () => { closeMenu(); openHelp(); };

  /* ---------------- Markdown import / export ---------------- */
  const RECUR_TOKENS = { daily: 'daily', weekly: 'weekly', monthly: 'monthly', quarterly: 'quarterly', yearly: 'yearly' };

  document.getElementById('menu-export').onclick = () => {
    closeMenu();
    const lines = [];
    (function walk(node, depth) {
      for (const c of node.children) {
        let meta = '';
        if (c.date || c.recurring) {
          const parts = [];
          if (c.date) parts.push(c.date);
          if (c.recurring && RECUR_TOKENS[c.recurring]) parts.push('~' + RECUR_TOKENS[c.recurring]);
          if (parts.length) meta = ' (!' + parts.join(' ') + ')';
        }
        lines.push('  '.repeat(depth) + '- ' + (c.completed ? '[x] ' : '') + c.text + meta);
        if (c.note) {
          c.note.split('\n').forEach(nl => lines.push('  '.repeat(depth) + '  ' + nl));
        }
        walk(c, depth + 1);
      }
    })(tree, 0);
    const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rinto-' + todayStr() + '.md';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const importFileInput = document.getElementById('import-file-input');
  document.getElementById('menu-import').onclick = () => { closeMenu(); importFileInput.click(); };

  importFileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const parsed = parseMarkdown(evt.target.result);
      if (parsed.length > 0) {
        pushUndo();
        const viewRoot = currentViewRoot();
        viewRoot.children = viewRoot.children.concat(parsed);
        render();
        scheduleSave();
        flashStatus('imported ' + parsed.length + ' top-level items');
      } else {
        flashStatus('nothing to import');
      }
      importFileInput.value = '';
    };
    reader.readAsText(file);
  };

  function parseMarkdown(text) {
    const lines = text.split(/\r?\n/);
    const rootChildren = [];
    const stack = [{ indent: -99, children: rootChildren, lastNode: null }];

    for (const rawLine of lines) {
      if (!rawLine.trim()) continue;

      // Headings become real items rather than notes glued to whatever
      // came before them; level maps onto depth.
      const headingMatch = rawLine.match(/^\s*(#{1,6})\s+\S/);
      const isBullet = /^\s*([-*+]|\d+\.)\s+/.test(rawLine);
      const indentMatch = rawLine.match(/^(\s*)/);
      let indent = indentMatch ? indentMatch[1].replace(/\t/g, '    ').length : 0;
      if (headingMatch) indent = (headingMatch[1].length - 1) * 2 - 1;

      let lineText = rawLine.trim();
      if (headingMatch) lineText = lineText.replace(/^#{1,6}\s+/, '');
      else if (isBullet) lineText = lineText.replace(/^([-*+]|\d+\.)\s+/, '');
      lineText = lineText.trim();

      let completed = false;
      if (/^\[[xX]\]\s/.test(lineText)) { completed = true; lineText = lineText.slice(4).trim(); }
      else if (/^\[\s?\]\s/.test(lineText)) { lineText = lineText.replace(/^\[\s?\]\s/, '').trim(); }

      let date = null, recurring = null;
      const metaMatch = lineText.match(/\(!(\d{4}-\d{2}-\d{2})?\s*(?:~([a-z]+))?\)/);
      if (metaMatch && (metaMatch[1] || metaMatch[2])) {
        date = metaMatch[1] || null;
        recurring = metaMatch[2] && RECUR_TOKENS[metaMatch[2]] ? metaMatch[2] : null;
        lineText = lineText.replace(metaMatch[0], '').trim();
      }

      if (isBullet || headingMatch) {
        const node = { id: newId(), text: lineText, note: '', date, recurring, completed, collapsed: false, children: [] };
        while (stack.length > 1 && stack[stack.length - 1].indent >= indent) stack.pop();
        stack[stack.length - 1].children.push(node);
        stack.push({ indent, children: node.children, lastNode: node });
      } else {
        const curr = stack[stack.length - 1].lastNode;
        if (curr) curr.note = curr.note ? curr.note + '\n' + lineText : lineText;
        else rootChildren.push({ id: newId(), text: lineText, note: '', date: null, recurring: null, completed: false, collapsed: false, children: [] });
      }
    }
    return rootChildren;
  }

  /* ---------------- Theme ---------------- */
  const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
  const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  const toggleThemeInput = document.getElementById('toggle-theme');
  // The icon lives inside a stable wrapper. The old version replaced the
  // <svg> via outerHTML, which threw away the id it needed to find next
  // time — so the second toggle threw and the theme never got saved.
  const themeIconEl = document.getElementById('theme-icon');

  function applyTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    toggleThemeInput.checked = (mode === 'dark');
    themeIconEl.innerHTML = mode === 'dark' ? ICON_MOON : ICON_SUN;
  }

  toggleThemeInput.onchange = async (e) => {
    const mode = e.target.checked ? 'dark' : 'light';
    applyTheme(mode);
    await storageSet(THEME_KEY, mode);
  };

  wireSwitchRow('menu-theme-row', toggleThemeInput);
  wireSwitchRow('menu-hide-completed-row', toggleHideCompleted);

  /* Header brand / home — one way back to a clean slate: top of the tree,
     no zoom, no date filter, no search. */
  function goHome() {
    zoomStack = ['root'];
    filterMode = 'all';
    searchQuery = '';
    resetFilterOverrides();
    searchInputEl.value = '';
    searchBoxEl.classList.remove('expanded');
    closePopover();
    closeMenu();
    render();
  }

  const appTitleEl = document.getElementById('app-title');
  appTitleEl.onclick = goHome;
  appTitleEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goHome(); }
  });
  document.getElementById('btn-home').onclick = goHome;

  (async () => {
    const saved = (await storageGet(THEME_KEY)) || (await storageGet('theme'));
    applyTheme(saved === 'light' ? 'light' : 'dark');
    await load();
  })();
})();
</script>
</body>
</html>
