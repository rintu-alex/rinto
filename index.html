<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rinto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  :root {
    --page-bg: #181822;
    --dyn-bg: #181822;
    --dyn-bg-raised: #222230;
    --dyn-border: #2e2e40;
    --dyn-text: #ececf1;
    --dyn-text-secondary: #9e9eb2;
    --dyn-text-muted: #64647a;
    --dyn-accent: #7ca1f8;
    --dyn-accent-dim: #2a3654;
    --dyn-hover: rgba(255,255,255,0.06);
    --dyn-amber: #e5b367;
    --dyn-red: #e57373;
    --dyn-green: #81c784;
    --note-border: #3b3b52;
  }
  html[data-theme="light"] {
    --page-bg: #f8f8fa;
    --dyn-bg: #f8f8fa;
    --dyn-bg-raised: #ebebf0;
    --dyn-border: #dcdce5;
    --dyn-text: #1a1a24;
    --dyn-text-secondary: #656578;
    --dyn-text-muted: #9595a8;
    --dyn-accent: #3b66d4;
    --dyn-accent-dim: #dbe4fa;
    --dyn-hover: rgba(0,0,0,0.04);
    --dyn-amber: #b87a1d;
    --dyn-red: #c94444;
    --dyn-green: #388e3c;
    --note-border: #cccccc;
  }
  * { box-sizing: border-box; }
  html, body { 
    background: var(--page-bg); 
    color: var(--dyn-text);
    font-family: 'Google Sans', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; 
    -moz-osx-font-smoothing: grayscale;
  }
  
  #app-shell { height: 100vh; width: 100vw; display: flex; flex-direction: column; background: var(--page-bg); transition: background-color 200ms ease; }
  #app-root { display: flex; flex-direction: column; height: 100%; max-width: 900px; width: 100%; margin: 0 auto; padding: 24px 32px; }

  /* Header Bar with Delayed Fade-Out */
  #top-bar { 
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0; margin-bottom: 20px; 
    max-height: 50px; overflow: visible; opacity: 1;
    transition: max-height 400ms cubic-bezier(0.2, 0, 0, 1), margin 400ms cubic-bezier(0.2, 0, 0, 1), opacity 400ms ease;
  }
  
  /* Delayed Zen mode body class */
  body.typing-mode #top-bar {
    max-height: 0;
    margin-bottom: 0;
    opacity: 0;
    pointer-events: none;
  }
  
  #top-left-group { display: flex; align-items: center; gap: 10px; }
  #app-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; cursor: pointer; }
  
  #nav-group { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  
  .filter-btn, #search-input, button, input, textarea { font-family: inherit; }

  .icon-btn { width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 8px; background: transparent; border: none; color: var(--dyn-text-secondary); cursor: pointer; transition: color 150ms ease, background-color 150ms ease; }
  .icon-btn:hover { color: var(--dyn-text); background: var(--dyn-hover); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Combined Filter Capsule */
  #filters { display: flex; gap: 2px; align-items: center; background: var(--dyn-bg-raised); border-radius: 8px; padding: 3px; border: 0.5px solid var(--dyn-border); }
  .filter-btn { font-size: 12.5px; font-weight: 500; padding: 4px 10px; border-radius: 6px; border: none; background: transparent; color: var(--dyn-text-muted); cursor: pointer; transition: background-color 150ms ease, color 150ms ease; display: flex; align-items: center; justify-content: center; }
  .filter-btn:hover { color: var(--dyn-text-secondary); }
  .filter-btn.active { background: var(--dyn-accent-dim); color: var(--dyn-accent); }
  .filter-btn.icon-filter { padding: 4px 6px; }
  .filter-btn.icon-filter svg { width: 15px; height: 15px; }

  /* Search Container (Appears BEFORE date filter) */
  #search-box { position: relative; display: flex; align-items: center; }
  #search-box .search-icon { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--dyn-text-muted); pointer-events: none; }
  #search-input { width: 130px; height: 32px; font-size: 13px; padding: 0 10px 0 28px; border-radius: 8px; border: 0.5px solid var(--dyn-border); background: var(--dyn-bg-raised); color: var(--dyn-text); outline: none; transition: width 180ms ease, border-color 150ms ease; }
  #search-input:focus { border-color: var(--dyn-accent); width: 180px; }
  #search-input::placeholder { color: var(--dyn-text-muted); }

  /* Redesigned Menu UX */
  .menu-container { position: relative; }
  .dropdown-menu { 
    position: absolute; right: 0; top: 40px; width: 230px; background: var(--dyn-bg-raised); border: 0.5px solid var(--dyn-border); 
    border-radius: 12px; padding: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); display: none; flex-direction: column; gap: 4px; z-index: 200; 
  }
  .dropdown-menu.show { display: flex; }
  .menu-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dyn-text-muted); padding: 6px 8px 2px 8px; }
  .menu-divider { height: 1px; background: var(--dyn-border); margin: 4px 0; }
  
  .dropdown-item { 
    display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 500; color: var(--dyn-text-secondary); 
    padding: 8px 10px; border-radius: 8px; border: none; background: transparent; cursor: pointer; width: 100%; text-align: left; transition: background-color 120ms ease, color 120ms ease;
  }
  .dropdown-item:hover { color: var(--dyn-text); background: var(--dyn-hover); }
  .dropdown-item-left { display: flex; align-items: center; gap: 10px; }
  .dropdown-item svg { width: 16px; height: 16px; color: var(--dyn-text-secondary); }
  .dropdown-item:hover svg { color: var(--dyn-text); }
  
  /* Menu Toggle Switch */
  .switch { position: relative; display: inline-block; width: 32px; height: 18px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--dyn-border); transition: .2s; border-radius: 18px; }
  .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--dyn-accent); }
  input:checked + .slider:before { transform: translateX(14px); }

  /* Main Canvas Area */
  #card { flex: 1; display: flex; flex-direction: column; min-height: 0; background: transparent; border: none; padding: 0; }
  
  /* Breadcrumbs Always Visible for Context */
  #breadcrumb { 
    font-size: 13px; color: var(--dyn-text-muted); min-height: 20px; display: flex; align-items: center; gap: 4px; margin-bottom: 12px; flex-shrink: 0; flex-wrap: wrap;
  }
  .crumb { cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: color 120ms ease, background-color 120ms ease; }
  .crumb:hover { color: var(--dyn-accent); background: var(--dyn-hover); }
  .crumb-sep { color: var(--dyn-text-muted); opacity: 0.6; }
  
  /* Zoomed Heading Display */
  #zoomed-heading { display: none; margin-bottom: 16px; flex-shrink: 0; }
  #zoomed-heading.active { display: block; }
  #zoomed-heading .zoom-title { font-size: 26px; font-weight: 700; color: var(--dyn-text); border: none; background: transparent; outline: none; width: 100%; line-height: 1.3; }

  #outline-list { flex: 1; overflow-y: auto; padding-right: 8px; }
  #outline-list::-webkit-scrollbar { width: 6px; }
  #outline-list::-webkit-scrollbar-thumb { background: var(--dyn-border); border-radius: 3px; }
  #outline-list::-webkit-scrollbar-track { background: transparent; }
  
  #toolbar { display: flex; align-items: center; margin-top: 8px; flex-shrink: 0; min-height: 14px; }
  #save-status { font-size: 11px; color: var(--dyn-text-muted); margin-left: auto; transition: opacity 300ms ease; }

  /* Tree Nodes & Precise Alignment */
  .node-wrapper { position: relative; }
  .node-wrapper.is-hidden { display: none !important; }
  .row { position: relative; display: flex; align-items: flex-start; padding: 2px 0; border-radius: 6px; }

  .caret { width: 16px; height: 26px; flex-shrink: 0; cursor: pointer; user-select: none; font-size: 10px; color: var(--dyn-text-muted); display: flex; align-items: center; justify-content: center; transform: rotate(0deg); transition: transform 150ms ease, color 150ms ease; }
  .caret.collapsed { transform: rotate(-90deg); }
  .caret.leaf { opacity: 0; pointer-events: none; }
  .caret:not(.leaf):hover { color: var(--dyn-text); }

  .bullet-dot { width: 18px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .bullet-dot::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background-color: var(--dyn-text-muted); transition: background-color 150ms ease, transform 150ms ease; }
  .row:hover .bullet-dot::after { background-color: var(--dyn-accent); transform: scale(1.3); }

  .content { flex: 1; outline: none; font-size: 15px; line-height: 1.6; padding: 1px 6px; min-height: 24px; white-space: pre-wrap; word-break: break-word; color: var(--dyn-text); caret-color: var(--dyn-accent); font-weight: 400; transition: text-decoration 150ms ease, opacity 150ms ease; }
  
  /* Bold Nodes with Children */
  .row.has-children > .content { font-weight: 600; }
  
  /* Strikethrough / Completion style (Ctrl+Enter) */
  .node-wrapper.completed > .row > .content { text-decoration: line-through; opacity: 0.45; }
  .node-wrapper.completed > .children-wrap { text-decoration: line-through; opacity: 0.45; }
  
  /* Tags & Project Highlighting */
  .tag-hash, .tag-at, .tag-repeat { 
    display: inline-flex; align-items: center; vertical-align: middle; height: 20px;
    padding: 0 6px; margin: 0 2px; border-radius: 4px; font-size: 13px; font-weight: 500; line-height: 1; 
  }
  .tag-hash { color: var(--dyn-accent); background: var(--dyn-accent-dim); }
  .tag-at { color: var(--dyn-amber); background: rgba(229, 179, 103, 0.18); }
  .tag-repeat { color: var(--dyn-green); background: rgba(129, 199, 132, 0.18); }

  /* Date Badge */
  .date-badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px; margin-left: 8px; margin-top: 3px; cursor: pointer; white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; transition: filter 120ms ease; }
  .date-badge:hover { filter: brightness(1.2); }
  .date-badge.d-future { background: var(--dyn-bg-raised); color: var(--dyn-text-secondary); border: 0.5px solid var(--dyn-border); }
  .date-badge.d-today { background: var(--dyn-accent-dim); color: var(--dyn-accent); }
  .date-badge.d-overdue { background: rgba(229,115,115,0.18); color: var(--dyn-red); }

  /* Note Field: Perfectly Aligned with Node Text */
  .note-field { 
    display: block; 
    width: calc(100% - 34px); 
    font-size: 13px; 
    line-height: 1.5; 
    color: var(--dyn-text-secondary); 
    background: transparent; 
    border: none; 
    border-left: 2px solid var(--note-border); 
    padding: 2px 0 2px 10px; 
    margin-top: 2px;
    margin-bottom: 6px;
    resize: none; 
    overflow: hidden; 
    outline: none; 
    transition: border-color 150ms ease;
  }
  .note-field:focus { color: var(--dyn-text); border-left-color: var(--dyn-accent); }

  /* Dynamic Floating Date Picker (Fixed positioning prevents cutoff) */
  #global-date-popover { 
    position: fixed; z-index: 1000; 
    background: var(--dyn-bg-raised); border: 0.5px solid var(--dyn-border); border-radius: 12px; padding: 10px; 
    display: flex; flex-direction: column; gap: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); width: 220px;
  }
  .pop-header { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--dyn-text-muted); }
  .pop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  #global-date-popover button { text-align: center; font-size: 12px; font-weight: 500; padding: 6px 8px; border: 0.5px solid var(--dyn-border); border-radius: 6px; background: var(--dyn-bg); color: var(--dyn-text-secondary); cursor: pointer; transition: background-color 120ms ease; }
  #global-date-popover button:hover { color: var(--dyn-text); background: var(--dyn-hover); }
  #global-date-popover input[type="date"] { width: 100%; font-size: 12.5px; padding: 6px; border-radius: 6px; border: 0.5px solid var(--dyn-border); background: var(--dyn-bg); color: var(--dyn-text); outline: none; }
  .repeat-select { font-size: 12px; padding: 5px 8px; border-radius: 6px; border: 0.5px solid var(--dyn-border); background: var(--dyn-bg); color: var(--dyn-text); outline: none; width: 100%; }

  .children-wrap { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 200ms ease, opacity 200ms ease; }
  .children-wrap.collapsed { grid-template-rows: 0fr; opacity: 0; }
  .children-inner { overflow: hidden; min-height: 0; }

  .filtered-path { font-size: 11px; color: var(--dyn-text-muted); margin-top: 2px; margin-bottom: 4px; }
  .empty-state { font-size: 14px; color: var(--dyn-text-muted); padding: 12px 0; font-style: italic; }
  .click-add { min-height: 32px; cursor: text; }
  .empty-state.click-add { flex: 1; min-height: 200px; }
</style>
</head>
<body>

<div id="app-shell">
  <div id="app-root">
    <!-- Header -->
    <div id="top-bar">
      <div id="top-left-group">
        <button class="icon-btn" id="btn-home" title="Home" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        </button>
        <div id="app-title">Rinto</div>
      </div>
      
      <div id="nav-group">
        <!-- Search Field (Placed BEFORE filter options) -->
        <div id="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input id="search-input" type="text" placeholder="Search...">
        </div>

        <!-- Filter Capsule -->
        <div id="filters">
          <button class="filter-btn icon-filter" id="btn-calendar" title="Toggle Today Filter" aria-label="Today Filter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </button>
          <button class="filter-btn active" data-filter="all">all</button>
          <button class="filter-btn" data-filter="today">today</button>
          <button class="filter-btn" data-filter="overdue">overdue</button>
        </div>

        <!-- Redesigned Vertical Dot Menu -->
        <div class="menu-container">
          <button class="icon-btn" id="btn-menu" title="Menu" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
          <div class="dropdown-menu" id="dropdown-menu">
            <div class="menu-section-label">Preferences</div>
            <div class="dropdown-item" id="menu-theme-row">
              <div class="dropdown-item-left">
                <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <span>Dark Mode</span>
              </div>
              <label class="switch"><input type="checkbox" id="toggle-theme"><span class="slider"></span></label>
            </div>
            <div class="dropdown-item" id="menu-hide-completed-row">
              <div class="dropdown-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                <span>Hide Completed</span>
              </div>
              <label class="switch"><input type="checkbox" id="toggle-hide-completed"><span class="slider"></span></label>
            </div>

            <div class="menu-divider"></div>
            <div class="menu-section-label">Actions</div>
            <button class="dropdown-item" id="menu-clear-completed">
              <div class="dropdown-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                <span>Clear Completed</span>
              </div>
            </button>

            <div class="menu-divider"></div>
            <div class="menu-section-label">Data</div>
            <button class="dropdown-item" id="menu-import">
              <div class="dropdown-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>Import Markdown</span>
              </div>
            </button>
            <button class="dropdown-item" id="menu-export">
              <div class="dropdown-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>Export Markdown</span>
              </div>
            </button>
          </div>
        </div>
        <input type="file" id="import-file-input" accept=".md,.txt" style="display: none;">
      </div>
    </div>

    <div id="card">
      <!-- Breadcrumbs Always Visible to Maintain Context -->
      <div id="breadcrumb"></div>

      <!-- Zoomed Node Main Heading Title -->
      <div id="zoomed-heading">
        <input type="text" class="zoom-title" id="zoom-title-input" placeholder="Untitled">
      </div>

      <div id="outline-list"></div>
      
      <div id="toolbar">
        <span id="save-status"></span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'outliner-lite-tree-v3';
  const SETTINGS_KEY = 'outliner-settings-v1';
  const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage !== null && typeof window.storage.get === 'function');

  // Application State
  let tree = { id: 'root', text: '', note: '', date: null, recurring: null, completed: false, children: [] };
  let zoomStack = ['root'];
  let filterMode = 'all';
  let hideCompleted = false;
  let saveTimer = null;
  let idCounter = 1;
  let pendingFocus = null;
  let activeId = null;
  let openPopoverId = null;
  let searchQuery = '';
  let zenTimeout = null;

  function newId() { return 'n' + Date.now().toString(36) + (idCounter++); }
  function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  
  function highlightText(text) {
    const esc = escapeHtml(text || '');
    return esc.replace(/(^|\s)(#[\w-]+)/g, '$1<span class="tag-hash">$2</span>')
               .replace(/(^|\s)(@[\w-]+)/g, '$1<span class="tag-at">$2</span>');
  }

  function findNode(node, id) { if (node.id === id) return node; for (const c of node.children) { const r = findNode(c, id); if (r) return r; } return null; }
  function findParent(node, id, parent) { if (node.id === id) return parent; for (const c of node.children) { const r = findParent(c, id, node); if (r !== null) return r; } return null; }
  function pathTo(node, id, acc) { if (node.id === id) return acc; for (const c of node.children) { const r = pathTo(c, id, acc.concat([c.id])); if (r) return r; } return null; }
  function siblingsAndIndex(id) { const parent = findParent(tree, id, null); if (!parent) return null; return { parent, idx: parent.children.findIndex(c => c.id === id) }; }

  /* 3-Second Delayed Zen Mode Fade */
  function resetZenTimer() {
    document.body.classList.remove('typing-mode');
    clearTimeout(zenTimeout);
    if (document.activeElement && (document.activeElement.isContentEditable || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT')) {
      zenTimeout = setTimeout(() => {
        document.body.classList.add('typing-mode');
      }, 3000); // 3 seconds delay before hiding header
    }
  }

  document.addEventListener('focusin', resetZenTimer);
  document.addEventListener('mousemove', resetZenTimer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      clearTimeout(zenTimeout);
      document.body.classList.remove('typing-mode');
      if (document.activeElement) document.activeElement.blur();
      closePopover();
      closeMenu();
    } else {
      resetZenTimer();
    }
  });

  async function storageGet(key) {
    if (hasCloudStorage) {
      try { const r = await window.storage.get(key, false); return r ? r.value : null; }
      catch (e) { return null; }
    }
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  async function storageSet(key, value) {
    if (hasCloudStorage) { await window.storage.set(key, value, false); return; }
    localStorage.setItem(key, value);
  }

  function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function dateClass(dateStr) {
    if (!dateStr) return '';
    if (dateStr === todayStr()) return 'd-today';
    if (dateStr < todayStr()) return 'd-overdue';
    return 'd-future';
  }
  function formatDate(dateStr) {
    if (!dateStr) return '';
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    if (dateStr === todayStr()) return 'today';
    return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  /* Date Recurring Math */
  function calcNextDate(dateStr, recurringType) {
    if (!dateStr) dateStr = todayStr();
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    if (recurringType === 'daily') dt.setDate(dt.getDate() + 1);
    else if (recurringType === 'weekly') dt.setDate(dt.getDate() + 7);
    else if (recurringType === 'monthly') dt.setMonth(dt.getMonth() + 1);
    else if (recurringType === 'yearly') dt.setFullYear(dt.getFullYear() + 1);
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
  }

  function scheduleSave() {
    const statusEl = document.getElementById('save-status');
    if (statusEl) { statusEl.style.opacity = '1'; statusEl.textContent = 'saving…'; }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        await storageSet(STORAGE_KEY, JSON.stringify(tree));
        await storageSet(SETTINGS_KEY, JSON.stringify({ hideCompleted }));
        if (statusEl) { statusEl.textContent = hasCloudStorage ? 'saved' : 'saved locally'; setTimeout(() => { statusEl.style.opacity = '0'; }, 900); }
      } catch (e) { if (statusEl) statusEl.textContent = 'save failed'; console.error(e); }
    }, 400);
  }

  async function load() {
    try {
      const raw = await storageGet(STORAGE_KEY);
      if (raw) tree = JSON.parse(raw);
      const settings = await storageGet(SETTINGS_KEY);
      if (settings) {
        const parsed = JSON.parse(settings);
        hideCompleted = !!parsed.hideCompleted;
        document.getElementById('toggle-hide-completed').checked = hideCompleted;
      }
    } catch (e) { tree = { id: 'root', text: '', note: '', date: null, recurring: null, completed: false, children: [] }; }
    render();
  }

  function currentViewRoot() { return findNode(tree, zoomStack[zoomStack.length - 1]) || tree; }

  /* Breadcrumbs & Zoomed Title Handling */
  function renderBreadcrumbAndHeader() {
    const el = document.getElementById('breadcrumb');
    const zoomHeader = document.getElementById('zoomed-heading');
    const zoomInput = document.getElementById('zoom-title-input');
    el.innerHTML = '';

    zoomStack.forEach((id, i) => {
      const node = findNode(tree, id);
      const label = i === 0 ? 'Home' : (node.text || '(untitled)').slice(0, 30);
      const span = document.createElement('span');
      span.className = 'crumb';
      span.textContent = label;
      span.onclick = () => { zoomStack = zoomStack.slice(0, i + 1); render(); };
      el.appendChild(span);
      if (i < zoomStack.length - 1) { const sep = document.createElement('span'); sep.className = 'crumb-sep'; sep.textContent = '\u203A'; el.appendChild(sep); }
    });

    const currNode = currentViewRoot();
    if (zoomStack.length > 1 && currNode) {
      zoomHeader.classList.add('active');
      zoomInput.value = currNode.text;
      zoomInput.oninput = (e) => {
        currNode.text = e.target.value;
        renderBreadcrumbAndHeader();
        scheduleSave();
      };
    } else {
      zoomHeader.classList.remove('active');
    }
  }

  function closePopover() { 
    const p = document.getElementById('global-date-popover'); 
    if (p) p.remove(); 
    openPopoverId = null; 
  }

  /* Fixed Viewport Date Picker Popover (No Cutoff!) */
  function openDatePopover(node, triggerEl) {
    closePopover();
    openPopoverId = node.id;
    
    const pop = document.createElement('div');
    pop.id = 'global-date-popover';
    
    const rect = triggerEl.getBoundingClientRect();
    let top = rect.bottom + 6;
    if (top + 230 > window.innerHeight) top = rect.top - 235; // Dropup if bottom screen space is tight
    const left = Math.max(16, Math.min(rect.left, window.innerWidth - 240));

    pop.style.top = top + 'px';
    pop.style.left = left + 'px';

    const setDateVal = (val, recVal) => {
      node.date = val;
      if (recVal !== undefined) node.recurring = recVal;
      closePopover();
      render();
      scheduleSave();
    };

    const hdr = document.createElement('div');
    hdr.className = 'pop-header';
    hdr.textContent = 'Set Due Date';
    pop.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'pop-grid';

    const t = new Date();
    const iso = (d) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const tomorrow = new Date(t); tomorrow.setDate(t.getDate()+1);
    const nextWeek = new Date(t); nextWeek.setDate(t.getDate()+7);

    const mkBtn = (label, val) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = (e) => { e.stopPropagation(); setDateVal(val); };
      return b;
    };

    grid.appendChild(mkBtn('Today', iso(t)));
    grid.appendChild(mkBtn('Tomorrow', iso(tomorrow)));
    grid.appendChild(mkBtn('Next Week', iso(nextWeek)));
    grid.appendChild(mkBtn('Clear', null));
    pop.appendChild(grid);

    const input = document.createElement('input');
    input.type = 'date';
    input.value = node.date || '';
    input.onchange = (e) => setDateVal(e.target.value || null);
    pop.appendChild(input);

    const recLabel = document.createElement('div');
    recLabel.className = 'pop-header';
    recLabel.textContent = 'Repeat / Recurring';
    pop.appendChild(recLabel);

    const select = document.createElement('select');
    select.className = 'repeat-select';
    select.innerHTML = `
      <option value="">No Repeat</option>
      <option value="daily" ${node.recurring === 'daily' ? 'selected' : ''}>Daily</option>
      <option value="weekly" ${node.recurring === 'weekly' ? 'selected' : ''}>Weekly</option>
      <option value="monthly" ${node.recurring === 'monthly' ? 'selected' : ''}>Monthly</option>
      <option value="yearly" ${node.recurring === 'yearly' ? 'selected' : ''}>Yearly</option>
    `;
    select.onchange = (e) => setDateVal(node.date || todayStr(), e.target.value || null);
    pop.appendChild(select);

    document.body.appendChild(pop);
  }

  function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

  function setActive(id) {
    if (activeId && activeId !== id) {
      const prevNote = document.querySelector('.note-field[data-id="' + activeId + '"]');
      if (prevNote && !prevNote.value.trim()) prevNote.style.display = 'none';
    }
    activeId = id;
  }

  function getCaretOffset(el) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return 0;
    const range = sel.getRangeAt(0);
    const pre = range.cloneRange();
    pre.selectNodeContents(el);
    pre.setEnd(range.startContainer, range.startOffset);
    return pre.toString().length;
  }

  function setCaretByOffset(el, offset) {
    const sel = window.getSelection();
    const range = document.createRange();
    let remaining = offset, targetNode = el, targetOffset = 0;
    function walk(n) {
      if (n.nodeType === Node.TEXT_NODE) {
        const len = n.textContent.length;
        if (remaining <= len) { targetNode = n; targetOffset = remaining; return true; }
        remaining -= len;
      } else {
        for (const child of n.childNodes) { if (walk(child)) return true; }
      }
      return false;
    }
    walk(el);
    range.setStart(targetNode, targetOffset); range.collapse(true);
    sel.removeAllRanges(); sel.addRange(range);
  }

  function buildNodeEl(node, depth) {
    const wrapper = document.createElement('div');
    wrapper.className = 'node-wrapper' + (node.completed ? ' completed' : '') + (hideCompleted && node.completed ? ' is-hidden' : '');
    wrapper.dataset.id = node.id;

    const hasChildren = node.children && node.children.length > 0;

    const row = document.createElement('div');
    row.className = 'row' + (hasChildren ? ' has-children' : '');
    const indentPx = depth * 24;
    row.style.marginLeft = indentPx + 'px';

    const isLeaf = !hasChildren;
    
    const caret = document.createElement('div');
    caret.className = 'caret' + (isLeaf ? ' leaf' : '') + (node.collapsed ? ' collapsed' : '');
    caret.textContent = '▾';
    if (!isLeaf) caret.onclick = () => toggleCollapse(node.id);
    row.appendChild(caret);

    /* Bullet Dot: Click to ZOOM IN */
    const bullet = document.createElement('div');
    bullet.className = 'bullet-dot';
    bullet.title = 'Click to zoom in';
    bullet.onclick = () => { zoomStack.push(node.id); render(); };
    row.appendChild(bullet);

    const content = document.createElement('div');
    content.className = 'content';
    content.contentEditable = 'true';
    content.dataset.id = node.id;
    content.innerHTML = highlightText(node.text);
    
    content.addEventListener('focus', () => setActive(node.id));
    content.addEventListener('input', () => onContentInput(content, node, row));
    content.addEventListener('keydown', (e) => onKeyDown(e, node.id));
    row.appendChild(content);

    /* Date Badge & Recurring Tag */
    if (node.date || node.recurring) {
      const badge = document.createElement('div');
      badge.className = 'date-badge ' + (node.date ? dateClass(node.date) : 'd-future');
      badge.innerHTML = (node.date ? formatDate(node.date) : 'No date') + (node.recurring ? ` <span class="tag-repeat">↻ ${node.recurring}</span>` : '');
      badge.onclick = (e) => { e.stopPropagation(); openDatePopover(node, badge); };
      row.appendChild(badge);
    }

    wrapper.appendChild(row);

    /* Note Field: Rendered ONLY when present or triggered with Shift+Enter.
       Indentation matches the text position (indentPx + 34px). */
    const note = document.createElement('textarea');
    note.className = 'note-field';
    note.dataset.id = node.id;
    note.style.marginLeft = (indentPx + 34) + 'px';
    note.value = node.note || '';
    note.rows = 1;
    note.placeholder = "Add note...";
    const showNote = !!(node.note && node.note.trim()) || node.id === activeId && node.showNote;
    note.style.display = showNote ? 'block' : 'none';
    note.addEventListener('focus', () => setActive(node.id));
    note.addEventListener('input', () => { node.note = note.value; autoResize(note); scheduleSave(); });
    note.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || (e.key === 'Enter' && !e.shiftKey)) { 
        e.preventDefault(); 
        if (!note.value.trim()) { node.note = ''; node.showNote = false; note.style.display = 'none'; }
        focusNode(node.id, false); 
      }
    });
    note.addEventListener('blur', () => {
      if (!note.value.trim()) { node.note = ''; node.showNote = false; note.style.display = 'none'; }
    });
    wrapper.appendChild(note);
    if (showNote) requestAnimationFrame(() => autoResize(note));

    if (hasChildren) {
      const childrenWrap = document.createElement('div');
      childrenWrap.className = 'children-wrap' + (node.collapsed ? ' collapsed' : '');
      const inner = document.createElement('div');
      inner.className = 'children-inner';
      node.children.forEach(c => inner.appendChild(buildNodeEl(c, depth + 1)));
      childrenWrap.appendChild(inner);
      wrapper.appendChild(childrenWrap);
    }
    return wrapper;
  }

  function onContentInput(el, node, row) {
    let caretOffset = getCaretOffset(el);
    let text = el.textContent;

    if (caretOffset > 0 && text[caretOffset - 1] === '!') {
      text = text.slice(0, caretOffset - 1) + text.slice(caretOffset);
      caretOffset -= 1;
      node.text = text;
      el.innerHTML = highlightText(text);
      setCaretByOffset(el, caretOffset);
      openDatePopover(node, row);
      scheduleSave();
      return;
    }

    node.text = text;
    el.innerHTML = highlightText(text);
    setCaretByOffset(el, caretOffset);
    scheduleSave();
  }

  function toggleCollapse(id) {
    const node = findNode(tree, id);
    node.collapsed = !node.collapsed;
    render();
    scheduleSave();
  }

  function onKeyDown(e, id) {
    const node = findNode(tree, id);
    const el = e.target;

    /* Shift+Enter: Show/Add Note under item */
    if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      node.showNote = true;
      setActive(id);
      const note = document.querySelector('.note-field[data-id="' + id + '"]');
      if (note) { 
        note.style.display = 'block'; 
        note.focus(); 
        autoResize(note); 
      }
      return;
    }

    /* Ctrl+Enter or Cmd+Enter: Strikethrough Item & Regenerate if Recurring */
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      node.completed = !node.completed;

      // Recurring Task Logic: If checking off a recurring task, generate next instance!
      if (node.completed && node.recurring) {
        const nextDate = calcNextDate(node.date, node.recurring);
        const sib = siblingsAndIndex(id);
        const nextNode = {
          id: newId(),
          text: node.text,
          note: node.note,
          date: nextDate,
          recurring: node.recurring,
          completed: false,
          children: JSON.parse(JSON.stringify(node.children))
        };
        sib.parent.children.splice(sib.idx + 1, 0, nextNode);
      }

      render();
      scheduleSave();
      return;
    }

    /* Regular Enter: Create new bullet sibling */
    if (e.key === 'Enter') {
      e.preventDefault();
      const offset = getCaretOffset(el);
      const before = node.text.slice(0, offset);
      const after = node.text.slice(offset);
      node.text = before;
      const sib = siblingsAndIndex(id);
      const newNode = { id: newId(), text: after, note: '', date: null, recurring: null, completed: false, children: [] };
      sib.parent.children.splice(sib.idx + 1, 0, newNode);
      pendingFocus = { id: newNode.id, atStart: true };
      render();
      scheduleSave();
      return;
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      const sib = siblingsAndIndex(id);
      if (e.shiftKey) {
        const grandParent = findParent(tree, sib.parent.id, null);
        if (!grandParent) return;
        const gpInfo = siblingsAndIndex(sib.parent.id);
        sib.parent.children.splice(sib.idx, 1);
        gpInfo.parent.children.splice(gpInfo.idx + 1, 0, node);
      } else {
        if (sib.idx === 0) return;
        const prevSibling = sib.parent.children[sib.idx - 1];
        sib.parent.children.splice(sib.idx, 1);
        prevSibling.children.push(node);
        prevSibling.collapsed = false;
      }
      pendingFocus = { id, atStart: false };
      render();
      scheduleSave();
      return;
    }

    if (e.key === 'Backspace') {
      const offset = getCaretOffset(el);
      if (offset === 0) {
        const viewRoot = currentViewRoot();
        const flat = [];
        (function walk(n) { for (const c of n.children) { flat.push(c); if (!c.collapsed) walk(c); } })(viewRoot);
        const i = flat.findIndex(f => f.id === id);
        if (i > 0) {
          e.preventDefault();
          const prev = flat[i - 1];
          const sib = siblingsAndIndex(id);
          prev.text = prev.text + node.text;
          prev.note = prev.note || node.note || '';
          prev.children = prev.children.concat(node.children);
          sib.parent.children.splice(sib.idx, 1);
          pendingFocus = { id: prev.id, atStart: false };
          render();
          scheduleSave();
        }
      }
      return;
    }
  }

  function render() {
    renderBreadcrumbAndHeader();
    document.querySelectorAll('.filter-btn').forEach(b => {
      if (b.dataset.filter) {
        b.classList.toggle('active', b.dataset.filter === filterMode && !searchQuery.trim());
      }
    });
    
    const listEl = document.getElementById('outline-list');
    listEl.innerHTML = '';

    const viewRoot = currentViewRoot();
    if (viewRoot.children.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state click-add';
      empty.textContent = 'Click to add item...';
      empty.onclick = addBullet;
      listEl.appendChild(empty);
    } else {
      viewRoot.children.forEach((c) => listEl.appendChild(buildNodeEl(c, 0)));
      const spacer = document.createElement('div');
      spacer.className = 'click-add';
      spacer.style.height = '150px';
      spacer.onclick = addBullet;
      listEl.appendChild(spacer);
    }
    if (pendingFocus) { const { id, atStart } = pendingFocus; pendingFocus = null; focusNode(id, atStart); }
  }

  function focusNode(id, atStart) {
    requestAnimationFrame(() => {
      const el = document.querySelector('.content[data-id="' + id + '"]');
      if (!el) return;
      el.focus();
      const range = document.createRange(); const sel = window.getSelection();
      range.selectNodeContents(el); range.collapse(!!atStart);
      sel.removeAllRanges(); sel.addRange(range);
    });
  }

  function addBullet() {
    filterMode = 'all';
    searchQuery = '';
    document.getElementById('search-input').value = '';
    const viewRoot = currentViewRoot();
    const n = { id: newId(), text: '', note: '', date: null, recurring: null, completed: false, children: [] };
    viewRoot.children.push(n);
    pendingFocus = { id: n.id, atStart: true };
    render();
    scheduleSave();
  }

  /* Menu Toggle & Actions */
  const btnMenu = document.getElementById('btn-menu');
  const dropdownMenu = document.getElementById('dropdown-menu');

  function closeMenu() { dropdownMenu.classList.remove('show'); }
  btnMenu.onclick = (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('show'); };
  document.addEventListener('click', (e) => { if (!e.target.closest('.menu-container')) closeMenu(); });

  /* Hide Completed Toggle */
  document.getElementById('toggle-hide-completed').onchange = (e) => {
    hideCompleted = e.target.checked;
    render();
    scheduleSave();
  };

  /* Clear Completed Action */
  document.getElementById('menu-clear-completed').onclick = () => {
    closeMenu();
    function purge(node) {
      node.children = node.children.filter(c => !c.completed);
      node.children.forEach(purge);
    }
    purge(tree);
    render();
    scheduleSave();
  };

  /* Export Markdown */
  document.getElementById('menu-export').onclick = () => {
    closeMenu();
    const lines = [];
    (function walk(node, depth) {
      for (const c of node.children) {
        let line = '  '.repeat(depth) + '- ' + (c.completed ? '[x] ' : '') + c.text + (c.date ? ' (!' + c.date + ')' : '');
        lines.push(line);
        if (c.note) {
          c.note.split('\n').forEach(nl => lines.push('  '.repeat(depth) + '  ' + nl));
        }
        walk(c, depth + 1);
      }
    })(tree, 0);
    const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'notes.md'; a.click();
    URL.revokeObjectURL(url);
  };

  /* Import Markdown */
  const importFileInput = document.getElementById('import-file-input');
  document.getElementById('menu-import').onclick = () => { closeMenu(); importFileInput.click(); };

  importFileInput.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const parsed = parseMarkdown(evt.target.result);
      if (parsed.length > 0) {
        const viewRoot = currentViewRoot();
        viewRoot.children = viewRoot.children.concat(parsed);
        render(); scheduleSave();
      }
      importFileInput.value = '';
    };
    reader.readAsText(file);
  };

  function parseMarkdown(text) {
    const lines = text.split(/\r?\n/);
    const rootChildren = [];
    const stack = [{ indent: -1, children: rootChildren, lastNode: null }];

    for (let rawLine of lines) {
      if (!rawLine.trim()) continue;
      const indentMatch = rawLine.match(/^(\s*)/);
      const indent = indentMatch ? indentMatch[1].replace(/\t/g, '    ').length : 0;
      const isBullet = /^\s*([-*+]|\d+\.)\s+/.test(rawLine);
      let lineText = rawLine.replace(/^\s*([-*+]|\d+\.|\#+)\s+/, '').trim();

      let completed = false;
      if (lineText.startsWith('[x] ') || lineText.startsWith('[X] ')) {
        completed = true;
        lineText = lineText.slice(4);
      }

      let date = null;
      const dateMatch = lineText.match(/\(!(\d{4}-\d{2}-\d{2})\)/);
      if (dateMatch) { date = dateMatch[1]; lineText = lineText.replace(/\(!\d{4}-\d{2}-\d{2}\)/, '').trim(); }

      if (isBullet) {
        const node = { id: newId(), text: lineText, note: '', date: date, recurring: null, completed: completed, collapsed: false, children: [] };
        while (stack.length > 1 && stack[stack.length - 1].indent >= indent) stack.pop();
        stack[stack.length - 1].children.push(node);
        stack.push({ indent: indent, children: node.children, lastNode: node });
      } else {
        const curr = stack[stack.length - 1].lastNode;
        if (curr) curr.note = curr.note ? curr.note + '\n' + lineText : lineText;
      }
    }
    return rootChildren;
  }

  /* Theme Control Switch */
  const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
  const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  const toggleThemeInput = document.getElementById('toggle-theme');

  function applyTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    toggleThemeInput.checked = (mode === 'dark');
    document.getElementById('theme-icon').outerHTML = mode === 'dark' ? ICON_MOON : ICON_SUN;
  }

  toggleThemeInput.onchange = async (e) => {
    const mode = e.target.checked ? 'dark' : 'light';
    applyTheme(mode);
    await storageSet('theme', mode);
  };

  (async () => {
    const saved = await storageGet('theme');
    applyTheme(saved === 'light' ? 'light' : 'dark');
  })();

  /* Header Brand Click -> Return to Home */
  document.getElementById('app-title').onclick = () => { zoomStack = ['root']; render(); };
  document.getElementById('btn-home').onclick = () => { zoomStack = ['root']; render(); };

  load();
})();
</script>
</body>
</html>
