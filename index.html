<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rinto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  :root {
    --page-bg: #000000;
    --dyn-bg: #000000;
    --dyn-bg-raised: #101010;
    --dyn-border: #262626;
    --dyn-text: #ececf1;
    --dyn-text-secondary: #9e9eb2;
    --dyn-text-muted: #6b6b7a;
    --dyn-accent: #7ca1f8;
    --dyn-accent-dim: #1c2333;
    --dyn-hover: rgba(255,255,255,0.07);
    --dyn-amber: #e5b367;
    --dyn-red: #e57373;
    --dyn-green: #81c784;
    --note-border: #2a2a2a;
    --dyn-link: #7cd6c4;
    --dyn-link-bg: rgba(124,214,196,0.14);
    --dyn-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  html[data-theme="light"] {
    --page-bg: #f8f8fa;
    --dyn-bg: #f8f8fa;
    --dyn-bg-raised: #ebebf0;
    --dyn-border: #dcdce5;
    --dyn-text: #1a1a24;
    --dyn-text-secondary: #656578;
    --dyn-text-muted: #9595a8;
    --dyn-accent: #3b66d4;
    --dyn-accent-dim: #dbe4fa;
    --dyn-hover: rgba(0,0,0,0.04);
    --dyn-amber: #b87a1d;
    --dyn-red: #c94444;
    --dyn-green: #388e3c;
    --note-border: #cccccc;
    --dyn-link: #0f8a76;
    --dyn-link-bg: #d9f2ee;
    --dyn-shadow: 0 12px 32px rgba(0,0,0,0.14);
  }
  /* Row geometry lives in tokens so the hit targets, the text baseline and
     the note indent can never drift apart. Coarse pointers (touch) get the
     44px targets; a mouse gets tighter rows, since precision is cheap there. */
  :root {
    --caret-w: 30px;
    --bullet-w: 26px;
    --indent-step: 24px;
    --row-min-h: 32px;
    --node-prefix: calc(var(--caret-w) + var(--bullet-w));
  }
  /* NOTE: don't hoist "indent-step * depth" into a :root custom property.
     var() inside a custom property is substituted where that property is
     DECLARED, so --depth would resolve once against :root (fallback 0) and
     every row would inherit a flat zero indent. It has to be spelled out in
     the real property, on the element that carries --depth. */
  @media (pointer: coarse) {
    :root { --caret-w: 44px; --bullet-w: 40px; --indent-step: 18px; --row-min-h: 44px; }
  }

  * { box-sizing: border-box; }
  html, body { 
    background: var(--page-bg); 
    color: var(--dyn-text);
    font-family: 'Google Sans', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; 
    -moz-osx-font-smoothing: grayscale;
  }
  
  #app-shell { height: 100vh; width: 100vw; display: flex; flex-direction: column; background: var(--page-bg); transition: background-color 200ms ease; }
  #app-root { display: flex; flex-direction: column; height: 100%; max-width: 900px; width: 100%; margin: 0 auto; padding: 24px 32px; }

  /* Header Bar — always visible (auto-hide removed per request) */
  #top-bar { 
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0; margin-bottom: 20px; 
  }

  #top-left-group { display: flex; align-items: center; gap: 10px; }
  #app-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; cursor: pointer; border-radius: 6px; padding: 2px 4px; }
  #app-title:focus-visible { outline: 2px solid var(--dyn-accent); outline-offset: 2px; }
  
  #nav-group { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  
  .filter-btn, #search-input, button, input, textarea { font-family: inherit; }

  .icon-btn { width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 8px; background: transparent; border: none; color: var(--dyn-text-secondary); cursor: pointer; transition: color 150ms ease, background-color 150ms ease; }
  .icon-btn:hover { color: var(--dyn-text); background: var(--dyn-hover); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Visible keyboard focus for every non-text control */
  .icon-btn:focus-visible, .filter-btn:focus-visible, .dropdown-item:focus-visible,
  .crumb:focus-visible, .bullet-dot:focus-visible, .caret:focus-visible,
  .date-badge:focus-visible, .row-move-btn:focus-visible, .filter-clear:focus-visible,
  #global-popover button:focus-visible, #send-to-list button:focus-visible {
    outline: 2px solid var(--dyn-accent); outline-offset: 2px;
  }

  /* Date Filter: collapsed to an icon by default, expands on click.
     When active, a badge (label + ×) sits outside the collapse — always
     reachable to clear without reopening the Today/Due picker. */
  #filters { display: flex; align-items: center; }
  #btn-search-toggle { position: relative; }
  #btn-search-toggle.has-active::after { content: ''; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--dyn-accent); }
  #filter-options { display: flex; align-items: center; gap: 2px; background: var(--dyn-bg-raised); border-radius: 8px; padding: 3px; border: 0.5px solid var(--dyn-border); }
  /* The clear button only exists while something is filtered, and it sits
     joined to the active chip so it reads as "clear *this*" rather than as a
     stray × at the end of the group. */
  .filter-clear { display: none; align-items: center; justify-content: center; width: 22px; height: 24px; margin-left: -2px; background: var(--dyn-accent-dim); border: none; color: var(--dyn-accent); font-size: 15px; line-height: 1; border-radius: 0 6px 6px 0; cursor: pointer; }
  #filter-options.has-active .filter-clear { display: flex; }
  #filter-options.has-active .filter-btn.active { border-radius: 6px 0 0 6px; padding-right: 7px; }
  .filter-clear:hover { color: var(--dyn-text); background: var(--dyn-accent); }
  html[data-theme="light"] .filter-clear:hover { color: var(--page-bg); }
  .filter-btn { font-size: 12.5px; font-weight: 500; padding: 4px 10px; border-radius: 6px; border: none; background: transparent; color: var(--dyn-text-muted); cursor: pointer; transition: background-color 150ms ease, color 150ms ease; }
  .filter-btn:hover { color: var(--dyn-text-secondary); }
  .filter-btn.active { background: var(--dyn-accent-dim); color: var(--dyn-accent); }

  /* Search: collapsed to an icon by default, expands into the input on click */
  #search-box { display: flex; align-items: center; }
  #search-input { width: 0; height: 32px; font-size: 13px; padding: 0; border-radius: 8px; border: 0.5px solid transparent; background: var(--dyn-bg-raised); color: var(--dyn-text); outline: none; opacity: 0; transition: width 180ms ease, padding 180ms ease, opacity 120ms ease, border-color 150ms ease; }
  #search-box.expanded #search-input { width: 160px; padding: 0 10px; opacity: 1; border-color: var(--dyn-border); margin-left: 4px; }
  #search-input:focus { border-color: var(--dyn-accent); }
  #search-input::placeholder { color: var(--dyn-text-muted); }

  /* Redesigned Menu UX */
  .menu-container { position: relative; }
  .dropdown-menu { 
    position: absolute; right: 0; top: 40px; width: 240px; background: var(--dyn-bg-raised); border: 0.5px solid var(--dyn-border); 
    border-radius: 12px; padding: 8px; box-shadow: var(--dyn-shadow); display: none; flex-direction: column; gap: 4px; z-index: 200; 
  }
  .dropdown-menu.show { display: flex; }
  .menu-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dyn-text-muted); padding: 6px 8px 2px 8px; }
  .menu-divider { height: 1px; background: var(--dyn-border); margin: 4px 0; }
  
  .dropdown-item { 
    display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 500; color: var(--dyn-text-secondary); 
    padding: 8px 10px; border-radius: 8px; border: none; background: transparent; cursor: pointer; width: 100%; text-align: left; transition: background-color 120ms ease, color 120ms ease;
  }
  .dropdown-item:hover { color: var(--dyn-text); background: var(--dyn-hover); }
  .dropdown-item-left { display: flex; align-items: center; gap: 10px; }
  .dropdown-item svg { width: 16px; height: 16px; color: var(--dyn-text-secondary); }
  .dropdown-item:hover svg { color: var(--dyn-text); }
  #theme-icon { display: flex; align-items: center; }
  
  /* Menu Toggle Switch */
  .switch { position: relative; display: inline-block; width: 32px; height: 18px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--dyn-border); transition: .2s; border-radius: 18px; }
  .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--dyn-accent); }
  input:checked + .slider:before { transform: translateX(14px); }
  .switch input:focus-visible + .slider { outline: 2px solid var(--dyn-accent); outline-offset: 2px; }

  /* Main Canvas Area */
  #card { flex: 1; display: flex; flex-direction: column; min-height: 0; background: transparent; border: none; padding: 0; }
  
  /* Breadcrumbs Always Visible for Context */
  #breadcrumb { 
    font-size: 13px; color: var(--dyn-text-muted); min-height: 20px; display: flex; align-items: center; gap: 4px; margin-bottom: 12px; flex-shrink: 0; flex-wrap: wrap;
  }
  .crumb { cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: color 120ms ease, background-color 120ms ease; }
  .crumb:hover { color: var(--dyn-accent); background: var(--dyn-hover); }
  .crumb-sep { color: var(--dyn-text-muted); opacity: 0.6; }
  
  /* Zoomed Heading Display */
  #zoomed-heading { display: none; margin-bottom: 16px; flex-shrink: 0; }
  #zoomed-heading.active { display: block; }
  #zoomed-heading .zoom-title { font-size: 26px; font-weight: 700; color: var(--dyn-text); border: none; background: transparent; outline: none; width: 100%; line-height: 1.3; }

  #outline-list { flex: 1; overflow-y: auto; padding-right: 8px; padding-left: 22px; }
  #outline-list::-webkit-scrollbar { width: 6px; }
  #outline-list::-webkit-scrollbar-thumb { background: var(--dyn-border); border-radius: 3px; }
  #outline-list::-webkit-scrollbar-track { background: transparent; }
  
  #toolbar { display: flex; align-items: center; margin-top: 8px; flex-shrink: 0; min-height: 14px; }
  #save-status { font-size: 11px; color: var(--dyn-text-muted); margin-left: auto; transition: opacity 300ms ease; }

  /* Tree Nodes & Precise Alignment */
  .node-wrapper { position: relative; }
  .node-wrapper.is-hidden { display: none !important; }
  .row {
    position: relative; display: flex; align-items: flex-start;
    margin-left: calc(var(--indent-step) * var(--depth, 0));
    min-height: var(--row-min-h);
    padding: 0 4px 0 0; border-radius: 8px;
    cursor: text; /* the row is somewhere to write, not something to drag */
    transition: background-color 120ms ease;
  }
  /* One clean boundary around the whole line so it reads as a single target */
  .row:hover { background: var(--dyn-hover); }
  .row:focus-within { background: var(--dyn-hover); }

  /* Drag lives on its own handle in the gutter — nothing else shows a grab
     cursor, so a click never looks like the start of a drag. */
  .drag-handle {
    position: absolute; left: -20px; top: 0; width: 20px; height: var(--row-min-h);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; cursor: grab; color: var(--dyn-text-muted);
    transition: opacity 120ms ease, color 120ms ease;
  }
  .drag-handle svg { width: 12px; height: 12px; }
  .drag-handle:active { cursor: grabbing; }
  .row:hover .drag-handle { opacity: 0.5; }
  .drag-handle:hover { opacity: 1; color: var(--dyn-text-secondary); }
  @media (pointer: coarse) { .drag-handle { display: none; } }

  .caret {
    width: var(--caret-w); height: var(--row-min-h); flex-shrink: 0;
    cursor: pointer; user-select: none; font-size: 10px; color: var(--dyn-text-muted);
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; transition: color 150ms ease, background-color 150ms ease;
  }
  .caret-glyph { display: block; line-height: 1; transition: transform 150ms ease; }
  .caret.collapsed .caret-glyph { transform: rotate(-90deg); }
  .caret.leaf { opacity: 0; pointer-events: none; }
  .caret:not(.leaf):hover { color: var(--dyn-text); background: var(--dyn-hover); }

  .bullet-dot { width: var(--bullet-w); height: var(--row-min-h); flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; transition: background-color 150ms ease; }
  .bullet-dot:hover { background: var(--dyn-hover); }
  .bullet-dot::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background-color: var(--dyn-text-muted); transition: background-color 150ms ease, transform 150ms ease, box-shadow 150ms ease; }
  .bullet-dot:hover::after { background-color: var(--dyn-accent); transform: scale(1.4); }
  /* A collapsed parent gets a halo so hidden children are visible at a glance */
  .caret.collapsed ~ .bullet-dot::after { box-shadow: 0 0 0 4px var(--dyn-accent-dim); }
  .node-wrapper.dragging { opacity: 0.4; }
  .row.drag-over-before { box-shadow: inset 0 2px 0 0 var(--dyn-accent); }
  .row.drag-over-after { box-shadow: inset 0 -2px 0 0 var(--dyn-accent); }
  .row.drag-over-child { background: var(--dyn-accent-dim); border-radius: 6px; }

  .content { flex: 1; outline: none; cursor: text; font-size: 15px; line-height: 1.6; padding: calc((var(--row-min-h) - 24px) / 2) 6px; min-height: var(--row-min-h); white-space: pre-wrap; word-break: break-word; color: var(--dyn-text); caret-color: var(--dyn-accent); font-weight: 400; transition: text-decoration 150ms ease, opacity 150ms ease; }
  
  /* Bold Nodes with Children */
  .row.has-children > .content { font-weight: 600; }
  
  /* Strikethrough / Completion style (Ctrl+Enter) */
  .node-wrapper.completed > .row > .content { text-decoration: line-through; opacity: 0.45; }
  .node-wrapper.completed > .children-wrap { text-decoration: line-through; opacity: 0.45; }
  
  /* Tags & Project Highlighting */
  .tag-hash, .tag-at, .tag-repeat { 
    display: inline-flex; align-items: center; vertical-align: middle; height: 20px;
    padding: 0 6px; margin: 0 2px; border-radius: 4px; font-size: 13px; font-weight: 500; line-height: 1; 
  }
  .tag-hash { color: var(--dyn-accent); background: var(--dyn-accent-dim); }
  .tag-at { color: var(--dyn-amber); background: rgba(229, 179, 103, 0.18); }
  .tag-repeat { color: var(--dyn-green); background: rgba(129, 199, 132, 0.18); }

  /* Date Badge */
  .date-badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px; margin-left: 8px; margin-top: calc((var(--row-min-h) - 20px) / 2); cursor: pointer; white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; transition: filter 120ms ease; }
  .date-badge:hover { filter: brightness(1.2); }
  .date-badge.d-future { background: var(--dyn-bg-raised); color: var(--dyn-text-secondary); border: 0.5px solid var(--dyn-border); }
  .date-badge.d-today { background: var(--dyn-accent-dim); color: var(--dyn-accent); }
  .date-badge.d-overdue { background: rgba(229,115,115,0.18); color: var(--dyn-red); }

  /* Note Field: Perfectly Aligned with Node Text */
  .note-field { 
    display: block; 
    margin-left: calc(var(--indent-step) * var(--depth, 0) + var(--node-prefix));
    width: calc(100% - var(--indent-step) * var(--depth, 0) - var(--node-prefix));
    font-size: 13px; 
    line-height: 1.5; 
    color: var(--dyn-text-secondary); 
    background: transparent; 
    border: none; 
    border-left: 2px solid var(--note-border); 
    padding: 2px 0 2px 10px; 
    margin-top: 2px;
    margin-bottom: 6px;
    outline: none; 
    white-space: pre-wrap;
    word-break: break-word;
    transition: border-color 150ms ease;
  }
  .note-field:focus { color: var(--dyn-text); border-left-color: var(--dyn-accent); }
  .note-field:empty::before { content: attr(data-placeholder); color: var(--dyn-text-muted); }

  /* Link Chip: rendered inline when a URL is typed in content or notes */
  .link-chip {
    display: inline-block;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: middle;
    padding: 1px 8px 1px 6px;
    margin: 0 2px;
    border-radius: 10px;
    background: var(--dyn-link-bg);
    color: var(--dyn-link);
    font-size: 0.93em;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: filter 120ms ease;
  }
  .link-chip::before { content: '\2197\0020'; font-size: 11px; }
  .link-chip:hover { filter: brightness(1.2); }

  /* Row hover actions (move-to-hierarchy button) */
  .row-move-btn { opacity: 0; width: 28px; height: var(--row-min-h); flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px; color: var(--dyn-text-muted); transition: opacity 120ms ease, color 150ms ease, background-color 150ms ease; }
  .row-move-btn svg { width: 14px; height: 14px; }
  .row:hover .row-move-btn, .row-move-btn:focus { opacity: 1; }
  .row-move-btn:hover { color: var(--dyn-text); background: var(--dyn-hover); }

  /* Generic fixed popover (date picker / move picker) */
  #global-popover-list { display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow-y: auto; }

  /* Overlay palettes: "Send to…" search and the shortcut sheet */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 2000; display: flex; align-items: flex-start; justify-content: center; padding-top: 14vh; }
  #send-to-box, #help-box { width: 440px; max-width: 90vw; background: var(--dyn-bg-raised); border: 0.5px solid var(--dyn-border); border-radius: 12px; padding: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 8px; }
  #send-to-input { font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 0.5px solid var(--dyn-border); background: var(--dyn-bg); color: var(--dyn-text); outline: none; }
  #send-to-input:focus { border-color: var(--dyn-accent); }
  #send-to-list { display: flex; flex-direction: column; gap: 2px; max-height: 320px; overflow-y: auto; }
  #send-to-list button { text-align: left; padding: 8px 10px; font-size: 13px; border: none; border-radius: 6px; background: transparent; color: var(--dyn-text-secondary); cursor: pointer; width: 100%; }
  #send-to-list button:hover, #send-to-list button.active { background: var(--dyn-hover); color: var(--dyn-text); }

  /* Shortcut sheet */
  #help-box { padding: 16px 18px; max-height: 70vh; overflow-y: auto; }
  .help-title { font-size: 15px; font-weight: 700; color: var(--dyn-text); }
  .help-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--dyn-text-secondary); padding: 4px 0; }
  .help-row kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; background: var(--dyn-bg); border: 0.5px solid var(--dyn-border); border-radius: 5px; padding: 2px 6px; color: var(--dyn-text); white-space: nowrap; }
  .help-group { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--dyn-text-muted); margin-top: 10px; }

  /* #hashtag / @name suggestion dropdown */
  #tag-suggest-popover { position: fixed; z-index: 2500; background: var(--dyn-bg-raised); border: 0.5px solid var(--dyn-border); border-radius: 10px; padding: 4px; box-shadow: var(--dyn-shadow); min-width: 120px; max-width: 240px; max-height: 220px; overflow-y: auto; }
  .tag-suggest-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .tag-suggest-item:hover, .tag-suggest-item.active { background: var(--dyn-hover); }
  .tag-suggest-item .tag-hash, .tag-suggest-item .tag-at { pointer-events: none; }
  .tag-suggest-count { font-size: 10.5px; color: var(--dyn-text-muted); flex-shrink: 0; }

  /* Dynamic Floating Popover (Fixed positioning prevents cutoff) */
  #global-popover { 
    position: fixed; z-index: 1000; 
    background: var(--dyn-bg-raised); border: 0.5px solid var(--dyn-border); border-radius: 12px; padding: 10px; 
    display: flex; flex-direction: column; gap: 8px; box-shadow: var(--dyn-shadow); width: 220px;
  }
  .pop-header { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--dyn-text-muted); }
  #global-popover button { text-align: center; font-size: 12px; font-weight: 500; padding: 6px 8px; border: 0.5px solid var(--dyn-border); border-radius: 6px; background: var(--dyn-bg); color: var(--dyn-text-secondary); cursor: pointer; transition: background-color 120ms ease; }
  #global-popover button:hover { color: var(--dyn-text); background: var(--dyn-hover); }
  #global-popover-list button { text-align: left; padding: 6px 8px; }

  /* Date picker: quick-select shortcuts, calendar, and a second screen
     for picking a repeat cadence (shown only after a date is picked) */
  .dp-quick-grid { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 4px; }
  #global-popover .dp-quick-btn { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; background: var(--dyn-bg); border: 0.5px solid var(--dyn-border); cursor: pointer; text-align: left; font-family: inherit; transition: background-color 120ms ease, border-color 120ms ease; }
  .dp-quick-btn:hover { background: var(--dyn-hover); border-color: var(--dyn-accent); }
  .dp-quick-icon { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .dp-quick-icon svg { width: 14px; height: 14px; }
  .dp-quick-icon.c-green { background: rgba(129,199,132,0.18); color: var(--dyn-green); }
  .dp-quick-icon.c-amber { background: rgba(229,179,103,0.18); color: var(--dyn-amber); }
  .dp-quick-icon.c-link  { background: var(--dyn-link-bg); color: var(--dyn-link); }
  .dp-quick-label { font-size: 12px; font-weight: 600; color: var(--dyn-text); line-height: 1.2; }
  .dp-quick-sub { font-size: 10.5px; color: var(--dyn-text-muted); margin-top: 1px; }

  .dp-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; padding: 0 2px; }
  .dp-cal-label { font-size: 12px; font-weight: 700; color: var(--dyn-text); }
  .dp-cal-nav { display: flex; gap: 2px; }
  #global-popover .dp-cal-nav button { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--dyn-text-secondary); border-radius: 6px; cursor: pointer; padding: 0; }
  .dp-cal-nav button:hover { background: var(--dyn-hover); color: var(--dyn-text); }

  .dp-dow-row { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; font-size: 10px; font-weight: 700; color: var(--dyn-text-muted); margin-bottom: 2px; }
  .dp-cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; text-align: center; margin-bottom: 4px; }
  #global-popover .dp-cal-grid button { padding: 5px 0; border-radius: 8px; font-size: 11.5px; font-weight: 500; color: var(--dyn-text-secondary); background: transparent; border: none; cursor: pointer; font-family: inherit; }
  .dp-cal-grid button:hover { background: var(--dyn-hover); color: var(--dyn-text); }
  .dp-cal-grid div.dp-day-muted { padding: 5px 0; font-size: 11.5px; color: var(--dyn-text-muted); opacity: 0.4; }
  #global-popover .dp-cal-grid .dp-day-today { border: 1px solid var(--dyn-accent); color: var(--dyn-accent); }
  #global-popover .dp-cal-grid .dp-day-selected { background: var(--dyn-accent); color: var(--page-bg); font-weight: 700; }

  #global-popover .dp-back-link { background: none; border: none; color: var(--dyn-text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 2px; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; font-family: inherit; }
  .dp-back-link svg { width: 12px; height: 12px; }
  .dp-back-link:hover { color: var(--dyn-text); }
  .dp-confirm-label { font-size: 13px; font-weight: 600; color: var(--dyn-text); margin-bottom: 10px; }
  .dp-repeat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #global-popover .dp-repeat-btn { padding: 10px 8px; border-radius: 10px; background: var(--dyn-bg); border: 0.5px solid var(--dyn-border); color: var(--dyn-text); font-size: 12.5px; font-weight: 600; cursor: pointer; text-align: center; font-family: inherit; transition: background-color 120ms ease, border-color 120ms ease; }
  .dp-repeat-btn:hover { background: var(--dyn-hover); border-color: var(--dyn-accent); }

  #global-popover .dp-clear-btn { background: none; border: none; color: var(--dyn-red); font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 2px; font-family: inherit; }

  .children-wrap { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 200ms ease, opacity 200ms ease; }
  .children-wrap.collapsed { grid-template-rows: 0fr; opacity: 0; }
  .children-inner { overflow: hidden; min-height: 0; }

  .empty-state { font-size: 14px; color: var(--dyn-text-muted); padding: 12px 0; font-style: italic; }
  .click-add { min-height: 32px; cursor: text; }
  .empty-state.click-add { flex: 1; min-height: 200px; }

  @media (max-width: 640px) {
    #app-root { padding: 16px 14px; }
    #app-title { font-size: 18px; }
    #nav-group { gap: 4px; }
    #search-box.expanded #search-input { width: 104px; }
    .filter-btn { padding: 4px 7px; font-size: 11.5px; }
    #zoomed-heading .zoom-title { font-size: 22px; }

  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>

<body>

<div id="app-shell">
  <div id="app-root">
    <!-- Header -->
    <div id="top-bar">

        </button>
        <div id="app-title" role="button" tabindex="0" title="Home · clears search and filters">Rinto</div>
      </div>

        <!-- Search: collapsed to just the icon; click expands the input -->

          </button>

        <!-- Date filters: always on show, one active at a time, cleared with the × -->
        <div id="filters">

        <!-- Vertical Dot Menu -->

          </button>
          <div class="dropdown-menu" id="dropdown-menu">

              <div class="dropdown-item-left">

              <div class="dropdown-item-left">

                <span>Import Markdown</span>
              </div>

            <button class="dropdown-item" id="menu-export">
              <div class="dropdown-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

    <div id="card">
      <!-- Breadcrumbs Always Visible to Maintain Context -->
      <div id="breadcrumb"></div>

      <!-- Zoomed Node Main Heading Title -->

        <input type="text" class="zoom-title" id="zoom-title-input" placeholder="Untitled">
      </div>

      <div id="outline-list"></div>

      <div id="toolbar">
        <span id="save-status"></span>
      </div>

</div>

<script>
(function () {
  const STORAGE_KEY = 'outliner-lite-tree-v3';
  const SETTINGS_KEY = 'outliner-settings-v1';
  const THEME_KEY = 'outliner-theme-v1';
  const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage !== null && typeof window.storage.get === 'function');

  // Application State
  let tree = { id: 'root', text: '', note: '', date: null, recurring: null, completed: false, children: [] };
  let zoomStack = ['root'];
  let filterMode = 'all';
  let hideCompleted = false;
  let saveTimer = null;
  let idCounter = 1;
  let pendingFocus = null;
  let activeId = null;
  let searchQuery = '';

  function newId() { return 'n' + Date.now().toString(36) + (idCounter++); }
  function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function unescapeHtml(s) { return String(s).replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&'); }

  /* ---------------- Undo / Redo ----------------
     The tree is re-rendered from the model on every keystroke, which wipes
     out the browser's native contenteditable undo. So history is kept here
     instead: structural edits push a full snapshot, and typing pushes a
     coalesced one (at most one snapshot per 700ms burst). */
  const undoStack = [];
  const redoStack = [];
  let lastSnapshotAt = 0;

  function snapshot() { return JSON.stringify({ tree: tree, zoomStack: zoomStack }); }

  function pushUndo(coalesceMs) {
    const now = Date.now();
    if (coalesceMs && (now - lastSnapshotAt) < coalesceMs) return;
    undoStack.push(snapshot());
    if (undoStack.length > 120) undoStack.shift();
    redoStack.length = 0;
    lastSnapshotAt = now;
  }

  function restoreSnapshot(str) {
    const s = JSON.parse(str);
    tree = s.tree;
    zoomStack = Array.isArray(s.zoomStack) && s.zoomStack.length ? s.zoomStack : ['root'];
    render();
    scheduleSave();
  }

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    restoreSnapshot(undoStack.pop());
    lastSnapshotAt = 0;
    flashStatus('undo');
  }

  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    restoreSnapshot(redoStack.pop());
    lastSnapshotAt = 0;
    flashStatus('redo');
  }

  // Makes a non-<button> element (div/span used as a control) reachable by
  // Tab and activatable with Enter/Space, matching native button semantics.
  function makeKeyboardActivatable(el, handler, role) {
    el.tabIndex = 0;
    el.setAttribute('role', role || 'button');
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        e.stopPropagation();
        handler(e);
      }
    });
  }

  function renderInlineContent(text) {
    const esc = escapeHtml(text || '');
    // Links first (so URL query-string chars aren't mistaken for tags), then tags.
    let out = esc.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+\.[a-z]{2,}[^\s<]*)/gi, (m) => {
      return '<span class="link-chip" contenteditable="false" data-href="' + m + '">' + m + '</span>';
    });
    out = out.replace(/(^|\s)(#[\w-]+)/g, '$1<span class="tag-hash">$2</span>')
             .replace(/(^|\s)(@[\w-]+)/g, '$1<span class="tag-at">$2</span>');
    return out;
  }

  function findNode(node, id) { if (node.id === id) return node; for (const c of node.children) { const r = findNode(c, id); if (r) return r; } return null; }
  function findParent(node, id, parent) { if (node.id === id) return parent; for (const c of node.children) { const r = findParent(c, id, node); if (r !== null) return r; } return null; }
  function siblingsAndIndex(id) { const parent = findParent(tree, id, null); if (!parent) return null; return { parent, idx: parent.children.findIndex(c => c.id === id) }; }

  // Guards against a stale or structurally-broken zoom path. Two cases:
  // (1) the zoomed-into node was deleted outright (e.g. by Delete completed),
  // (2) a node that was moved/dragged elsewhere (Move to..., drag-and-drop,
  // Ctrl+Shift+M) still exists but is no longer actually nested under the
  // previous crumb. This walks the full chain and truncates at the first break.
  function sanitizeZoomStack() {
    for (let i = 1; i < zoomStack.length; i++) {
      const parent = findNode(tree, zoomStack[i - 1]);
      const isStillChild = parent && parent.children.some(c => c.id === zoomStack[i]);
      if (!isStillChild) { zoomStack = zoomStack.slice(0, i); break; }
    }
    if (zoomStack.length === 0) zoomStack = ['root'];
  }

  function collectDescendantIds(node, set) {
    set.add(node.id);
    node.children.forEach(c => collectDescendantIds(c, set));
    return set;
  }

  // Deep copy with fresh ids. The old version used JSON round-tripping,
  // which duplicated every child id — findNode() then resolved the wrong
  // node and edits landed in two places at once.
  function cloneSubtree(node, opts) {
    const o = opts || {};
    return {
      id: newId(),
      text: node.text,
      note: node.note,
      date: o.clearDates ? null : node.date,
      recurring: node.recurring,
      recurInterval: node.recurInterval,
      recurUnit: node.recurUnit,
      completed: o.clearCompleted ? false : node.completed,
      collapsed: node.collapsed,
      showNote: false,
      children: node.children.map(c => cloneSubtree(c, o))
    };
  }

  /* Filter / Search matching. A node matches if it passes the active
     text search AND the active date filter. Ancestors of a match stay
     visible (and forced open) so the match is reachable. */
  function isFilterActive() { return !!searchQuery.trim() || filterMode !== 'all'; }

  function nodeSelfMatches(node) {
    const q = searchQuery.trim().toLowerCase();
    if (q) {
      const hay = ((node.text || '') + ' ' + (node.note || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (filterMode === 'all') return true;
    if (!node.date) return false;
    const today = todayStr();
    // today:   within:today
    // overdue: within:-7d -within:today   (missed, but only the last week)
    // missed:  until:today -within:today  (everything past due, no floor)
    if (filterMode === 'today') return node.date === today;
    if (node.completed) return false; // a finished task isn't overdue or missed
    if (filterMode === 'overdue') return node.date < today && node.date >= daysFromToday(-7);
    if (filterMode === 'missed') return node.date < today;
    return true;
  }

  // Walks the tree once, marking which nodes should be visible (self or
  // descendant matches) and which should be force-expanded (have a
  // matching descendant) regardless of their stored collapsed state.
  function computeFilterState(node, visibleSet, forceOpenSet) {
    let anyChildVisible = false;
    for (const c of node.children) {
      if (computeFilterState(c, visibleSet, forceOpenSet)) anyChildVisible = true;
    }
    const visible = nodeSelfMatches(node) || anyChildVisible;
    if (visible) visibleSet.add(node.id);
    if (anyChildVisible) forceOpenSet.add(node.id);
    return visible;
  }

  // Ids the person explicitly collapsed *while* a filter was forcing them
  // open. Without this, clicking the caret on a force-opened branch looked
  // broken: the stored flag flipped but the filter re-opened it instantly.
  let filterCollapseOverride = new Set();
  function resetFilterOverrides() { filterCollapseOverride = new Set(); }

  function filterState() {
    if (!isFilterActive()) return { visibleSet: null, forceOpenSet: null };
    const visibleSet = new Set(), forceOpenSet = new Set();
    computeFilterState(tree, visibleSet, forceOpenSet);
    filterCollapseOverride.forEach(id => forceOpenSet.delete(id));
    return { visibleSet, forceOpenSet };
  }

  /* ---------------- Storage ---------------- */
  async function storageGet(key) {
    if (hasCloudStorage) {
      try { const r = await window.storage.get(key, false); return r ? r.value : null; }
      catch (e) { return null; }
    }
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  async function storageSet(key, value) {
    if (hasCloudStorage) { await window.storage.set(key, value, false); return; }
    try { localStorage.setItem(key, value); } catch (e) { /* private mode / quota */ }
  }

  /* ---------------- Dates ---------------- */
  function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function daysFromToday(n) { const d = new Date(); d.setDate(d.getDate() + n); return isoOf(d); }
  function addDays(dateStr, n) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    dt.setDate(dt.getDate() + n);
    return isoOf(dt);
  }
  function daysBetween(fromStr, toStr) {
    const [ay, am, ad] = fromStr.split('-').map(Number);
    const [by, bm, bd] = toStr.split('-').map(Number);
    return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
  }
  // Dated sub-steps travel with the parent: a checklist item due the same day
  // as this week's review should be due the same day of next week's, not stuck
  // in the past looking overdue the moment the new instance appears.
  function shiftSubtreeDates(node, deltaDays) {
    if (node.date) node.date = addDays(node.date, deltaDays);
    node.children.forEach(c => shiftSubtreeDates(c, deltaDays));
  }
  function subtreeHasCompleted(node) {
    return node.children.some(c => c.completed || subtreeHasCompleted(c));
  }
  function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function dateClass(dateStr) {
    if (!dateStr) return '';
    if (dateStr === todayStr()) return 'd-today';
    if (dateStr < todayStr()) return 'd-overdue';
    return 'd-future';
  }
  function formatDate(dateStr) {
    if (!dateStr) return '';
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    if (dateStr === todayStr()) return 'today';
    const t = new Date(); t.setDate(t.getDate() + 1);
    if (dateStr === isoOf(t)) return 'tomorrow';
    const opts = { month: 'short', day: 'numeric' };
    if (dt.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return dt.toLocaleDateString(undefined, opts);
  }

  /* Recurring math — supports the built-in cadences plus a custom
     interval/unit pair (e.g. "every 2 weeks") stored on the node. Custom
     has no UI to create it anymore, but existing saved data still works. */
  function calcNextDate(node) {
    const dateStr = node.date || todayStr();
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    const type = node.recurring;
    if (type === 'daily') dt.setDate(dt.getDate() + 1);
    else if (type === 'weekly') dt.setDate(dt.getDate() + 7);
    else if (type === 'monthly') dt.setMonth(dt.getMonth() + 1);
    else if (type === 'quarterly') dt.setMonth(dt.getMonth() + 3);
    else if (type === 'yearly') dt.setFullYear(dt.getFullYear() + 1);
    else if (type === 'custom') {
      const n = node.recurInterval || 1;
      const unit = node.recurUnit || 'weeks';
      if (unit === 'days') dt.setDate(dt.getDate() + n);
      else if (unit === 'weeks') dt.setDate(dt.getDate() + n * 7);
      else if (unit === 'months') dt.setMonth(dt.getMonth() + n);
    }
    // A repeat that lands in the past (task was checked off late) rolls
    // forward until it's actually in the future.
    let guard = 0;
    while (isoOf(dt) <= todayStr() && guard++ < 500) {
      if (type === 'daily') dt.setDate(dt.getDate() + 1);
      else if (type === 'weekly') dt.setDate(dt.getDate() + 7);
      else if (type === 'monthly') dt.setMonth(dt.getMonth() + 1);
      else if (type === 'quarterly') dt.setMonth(dt.getMonth() + 3);
      else if (type === 'yearly') dt.setFullYear(dt.getFullYear() + 1);
      else if (type === 'custom') {
        const n = node.recurInterval || 1;
        const unit = node.recurUnit || 'weeks';
        if (unit === 'days') dt.setDate(dt.getDate() + n);
        else if (unit === 'weeks') dt.setDate(dt.getDate() + n * 7);
        else dt.setMonth(dt.getMonth() + n);
      } else break;
    }
    return isoOf(dt);
  }

  function flashStatus(text) {
    const statusEl = document.getElementById('save-status');
    if (!statusEl) return;
    statusEl.style.opacity = '1';
    statusEl.textContent = text;
    setTimeout(() => { statusEl.style.opacity = '0'; }, 900);
  }

  function scheduleSave() {
    const statusEl = document.getElementById('save-status');
    if (statusEl) { statusEl.style.opacity = '1'; statusEl.textContent = 'saving…'; }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        await storageSet(STORAGE_KEY, JSON.stringify(tree));
        await storageSet(SETTINGS_KEY, JSON.stringify({ hideCompleted }));
        if (statusEl) { statusEl.textContent = hasCloudStorage ? 'saved' : 'saved locally'; setTimeout(() => { statusEl.style.opacity = '0'; }, 900); }
      } catch (e) { if (statusEl) statusEl.textContent = 'save failed'; console.error(e); }
    }, 400);
  }

  function normalizeTree(node) {
    if (!node || typeof node !== 'object') return null;
    if (!Array.isArray(node.children)) node.children = [];
    if (typeof node.text !== 'string') node.text = '';
    if (typeof node.note !== 'string') node.note = '';
    node.children = node.children.map(normalizeTree).filter(Boolean);
    return node;
  }

  async function load() {
    try {
      const raw = await storageGet(STORAGE_KEY);
      if (raw) {
        const parsed = normalizeTree(JSON.parse(raw));
        if (parsed) { parsed.id = 'root'; tree = parsed; }
      }
      const settings = await storageGet(SETTINGS_KEY);
      if (settings) {
        const parsed = JSON.parse(settings);
        hideCompleted = !!parsed.hideCompleted;
        document.getElementById('toggle-hide-completed').checked = hideCompleted;
      }
    } catch (e) {
      console.error('Could not read saved outline, starting fresh.', e);
      tree = { id: 'root', text: '', note: '', date: null, recurring: null, completed: false, children: [] };
    }
    render();
  }

  function currentViewRoot() { return findNode(tree, zoomStack[zoomStack.length - 1]) || tree; }

  /* ---------------- Breadcrumbs & zoomed title ---------------- */
  function renderBreadcrumbAndHeader() {
    sanitizeZoomStack();
    const el = document.getElementById('breadcrumb');
    const zoomHeader = document.getElementById('zoomed-heading');
    const zoomInput = document.getElementById('zoom-title-input');
    el.innerHTML = '';

    zoomStack.forEach((id, i) => {
      const node = findNode(tree, id);
      if (!node) return;
      const rawLabel = i === 0 ? 'Home' : (node.text || '(untitled)');
      const span = document.createElement('span');
      span.className = 'crumb';
      span.textContent = rawLabel.length > 30 ? rawLabel.slice(0, 30) + '\u2026' : rawLabel;
      span.title = rawLabel;
      const jumpTo = () => { zoomStack = zoomStack.slice(0, i + 1); render(); };
      span.onclick = jumpTo;
      if (i < zoomStack.length - 1) makeKeyboardActivatable(span, jumpTo); // last crumb is already "here"
      el.appendChild(span);
      if (i < zoomStack.length - 1) { const sep = document.createElement('span'); sep.className = 'crumb-sep'; sep.textContent = '\u203A'; el.appendChild(sep); }
    });

    const currNode = currentViewRoot();
    if (zoomStack.length > 1 && currNode) {
      zoomHeader.classList.add('active');
      // Only assign when it actually differs — reassigning on every keystroke
      // yanked the caret to the end of the field mid-word.
      if (zoomInput.value !== currNode.text) zoomInput.value = currNode.text;
      zoomInput.oninput = (e) => {
        pushUndo(700);
        currNode.text = e.target.value;
        renderBreadcrumbAndHeader();
        scheduleSave();
      };
      zoomInput.onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === 'ArrowDown') {
          e.preventDefault();
          if (currNode.children.length) focusNode(currNode.children[0].id, false);
          else addBullet();
        }
      };
    } else {
      zoomHeader.classList.remove('active');
      zoomInput.oninput = null;
      zoomInput.onkeydown = null;
    }
  }

  /* ---------------- Popovers ---------------- */
  // Popovers can register a cleanup that fires on ANY close (Escape,
  // outside click, or opening a different popover) — used by the date
  // picker so backing out of the repeat screen without an explicit choice
  // still applies the date you picked instead of silently discarding it.
  let popoverCleanup = null;
  function closePopover() {
    const p = document.getElementById('global-popover');
    if (p) p.remove();
    if (popoverCleanup) { const fn = popoverCleanup; popoverCleanup = null; fn(); }
  }

  // Shared fixed-position popover shell used by both the date picker and
  // the move-to-hierarchy picker. Flips above the trigger when there's
  // not enough room below, and clamps to its own width (the old code
  // assumed 220px, so the 300px date picker hung off the right edge).
  function createPopover(triggerEl, estHeight, width) {
    closePopover();
    const w = width || 220;
    const pop = document.createElement('div');
    pop.id = 'global-popover';
    pop.style.width = w + 'px';
    const rect = triggerEl.getBoundingClientRect();
    let top = rect.bottom + 6;
    if (top + estHeight > window.innerHeight) top = Math.max(8, rect.top - estHeight - 6);
    const left = Math.max(12, Math.min(rect.left, window.innerWidth - w - 12));
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
    document.body.appendChild(pop);
    return pop;
  }

  /* ---------------- Drag & drop ---------------- */
  let dragNodeId = null;
  let dragOverZone = null;

  function clearDragIndicators() {
    document.querySelectorAll('.row.drag-over-before, .row.drag-over-after, .row.drag-over-child').forEach(r => {
      r.classList.remove('drag-over-before', 'drag-over-after', 'drag-over-child');
    });
  }

  function performDrop(draggedId, targetId, zone) {
    const draggedNode = findNode(tree, draggedId);
    const targetNode = findNode(tree, targetId);
    if (!draggedNode || !targetNode) return;
    if (collectDescendantIds(draggedNode, new Set()).has(targetId)) return; // can't drop into own subtree
    const sib = siblingsAndIndex(draggedId);
    if (!sib) return;
    pushUndo();
    sib.parent.children.splice(sib.idx, 1); // detach first — target's index may shift
    if (zone === 'child') {
      targetNode.children.push(draggedNode);
      targetNode.collapsed = false;
    } else {
      const targetSib = siblingsAndIndex(targetId); // recomputed post-detach on purpose
      if (!targetSib) { sib.parent.children.splice(sib.idx, 0, draggedNode); return; }
      const insertIdx = zone === 'before' ? targetSib.idx : targetSib.idx + 1;
      targetSib.parent.children.splice(insertIdx, 0, draggedNode);
    }
    render();
    scheduleSave();
  }

  function moveSibling(id, direction) {
    const sib = siblingsAndIndex(id);
    if (!sib) return;
    const newIdx = sib.idx + direction;
    if (newIdx < 0 || newIdx >= sib.parent.children.length) return; // at the boundary — no-op
    pushUndo();
    const [item] = sib.parent.children.splice(sib.idx, 1);
    sib.parent.children.splice(newIdx, 0, item);
    pendingFocus = { id, atStart: false };
    render();
    scheduleSave();
  }

  function moveNodeTo(node, targetParent) {
    const sib = siblingsAndIndex(node.id);
    if (!sib || targetParent.id === sib.parent.id) { closePopover(); return; }
    pushUndo();
    sib.parent.children.splice(sib.idx, 1);
    targetParent.children.push(node);
    targetParent.collapsed = false;
    closePopover();
    render();
    scheduleSave();
    flashStatus('moved');
  }

  /* Move-to-hierarchy picker: flattens the whole tree, excluding the
     node's own subtree (can't move a node into itself). */
  function openMovePopover(node, triggerEl) {
    const pop = createPopover(triggerEl, 260, 240);

    const hdr = document.createElement('div');
    hdr.className = 'pop-header';
    hdr.textContent = 'Move to';
    pop.appendChild(hdr);

    const list = document.createElement('div');
    list.id = 'global-popover-list';

    const topBtn = document.createElement('button');
    topBtn.textContent = '\u2302 Top level';
    topBtn.onclick = (e) => { e.stopPropagation(); moveNodeTo(node, tree); };
    list.appendChild(topBtn);

    const excluded = collectDescendantIds(node, new Set());
    const rows = [];
    (function walk(n, depth) {
      n.children.forEach(c => {
        if (excluded.has(c.id)) return;
        rows.push({ node: c, depth });
        walk(c, depth + 1);
      });
    })(tree, 0);

    rows.forEach(r => {
      const b = document.createElement('button');
      const label = (r.node.text || '(untitled)').slice(0, 40);
      b.textContent = '\u00A0\u00A0'.repeat(r.depth) + label;
      b.onclick = (e) => { e.stopPropagation(); moveNodeTo(node, r.node); };
      list.appendChild(b);
    });

    if (rows.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Nowhere else to move it yet.';
      list.appendChild(empty);
    }

    pop.appendChild(list);
  }

  /* Ctrl+Shift+M: fuzzy-search palette to send the currently active item
     (the last-focused title or note) into any other node in the tree. */
  function closeSendToPalette() {
    const el = document.getElementById('send-to-overlay');
    if (el) el.remove();
  }

  function openSendToPalette() {
    if (!activeId) return;
    const node = findNode(tree, activeId);
    if (!node) return;
    closeSendToPalette();

    const excluded = collectDescendantIds(node, new Set());
    const overlay = document.createElement('div');
    overlay.id = 'send-to-overlay';
    overlay.className = 'overlay';
    overlay.onclick = (e) => { if (e.target === overlay) closeSendToPalette(); };

    const box = document.createElement('div');
    box.id = 'send-to-box';

    const input = document.createElement('input');
    input.id = 'send-to-input';
    input.type = 'text';
    input.placeholder = 'Send "' + (node.text || 'this item').slice(0, 40) + '" to\u2026';

    const list = document.createElement('div');
    list.id = 'send-to-list';
    let activeIdx = 0;

    function highlight() {
      Array.from(list.children).forEach((c, i) => {
        if (c.tagName === 'BUTTON') c.classList.toggle('active', i === activeIdx);
      });
      const el = list.children[activeIdx];
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    }

    function renderList(query) {
      list.innerHTML = '';
      activeIdx = 0;
      const q = query.trim().toLowerCase();

      if (!q || 'top level'.includes(q)) {
        const topBtn = document.createElement('button');
        topBtn.textContent = '\u2302 Top level';
        topBtn.onclick = () => { moveNodeTo(node, tree); closeSendToPalette(); };
        list.appendChild(topBtn);
      }

      const rows = [];
      (function walk(n, depth) {
        n.children.forEach(c => {
          if (excluded.has(c.id)) return;
          if (!q || (c.text || '').toLowerCase().includes(q)) rows.push({ node: c, depth });
          walk(c, depth + 1);
        });
      })(tree, 0);

      rows.slice(0, 50).forEach(r => {
        const b = document.createElement('button');
        b.textContent = '\u00A0\u00A0'.repeat(r.depth) + (r.node.text || '(untitled)').slice(0, 50);
        b.onclick = () => { moveNodeTo(node, r.node); closeSendToPalette(); };
        list.appendChild(b);
      });

      if (list.children.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No matches.';
        list.appendChild(empty);
      }
      highlight();
    }

    input.addEventListener('input', () => renderList(input.value));
    input.addEventListener('keydown', (e) => {
      const buttons = Array.from(list.children).filter(c => c.tagName === 'BUTTON');
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeSendToPalette(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, buttons.length - 1); highlight(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); highlight(); return; }
      if (e.key === 'Enter') { e.preventDefault(); if (buttons[activeIdx]) buttons[activeIdx].click(); return; }
    });

    box.appendChild(input);
    box.appendChild(list);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    renderList('');
    requestAnimationFrame(() => input.focus());
  }

  function closeHelp() { const el = document.getElementById('help-overlay'); if (el) el.remove(); }
